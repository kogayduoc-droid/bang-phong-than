                    </div>
                </div>
            `;
        }
// ==========================================
        // --- TÍNH NĂNG LỊCH BÁO GIẢNG THEO TIẾT ---
        // ==========================================
        function renderViewLichBaoGiang() {
            if (!state.teachingSchedule) state.teachingSchedule = {};
            if (!state.activeDay) state.activeDay = 2; // Mặc định hiển thị Thứ 2
            
            const days = [
                { id: 2, label: 'Thứ Hai' },
                { id: 3, label: 'Thứ Ba' },
                { id: 4, label: 'Thứ Tư' },
                { id: 5, label: 'Thứ Năm' },
                { id: 6, label: 'Thứ Sáu' },
                { id: 7, label: 'Thứ Bảy' }
            ];

            const excelDay = state.activeDay - 1; 
            let morningSlots = [];
            let afternoonSlots = [];

          // Đảm bảo có dữ liệu lịch chuẩn (Nếu trống thì tự tạo 8 tiết và gắn nhãn Sáng/Chiều)
            if (!state.dailySchedule) state.dailySchedule = {};
            if (!state.dailySchedule[excelDay] || state.dailySchedule[excelDay].length === 0) {
                state.dailySchedule[excelDay] = [
                    { period: 'Tiết 1', time: '07:15 - 08:00', session: 'Sáng' },
                    { period: 'Tiết 2', time: '08:00 - 08:45', session: 'Sáng' },
                    { period: 'Tiết 3', time: '09:05 - 09:50', session: 'Sáng' },
                    { period: 'Tiết 4', time: '09:50 - 10:35', session: 'Sáng' },
                    { period: 'Tiết 5', time: '10:45 - 11:30', session: 'Sáng' }
                ];
                if (state.activeDay !== 7) {
                    state.dailySchedule[excelDay].push(
                        { period: 'Tiết 6', time: '13:30 - 14:15', session: 'Chiều' },
                        { period: 'Tiết 7', time: '14:15 - 15:00', session: 'Chiều' },
                        { period: 'Tiết 8', time: '15:15 - 16:00', session: 'Chiều' }
                    );
                }
            }

            // Phân chia Sáng / Chiều thông minh: Khóa chặt vị trí không cho nhảy lộn xộn
            state.dailySchedule[excelDay].forEach((cls, index) => {
                // Gắn mác Sáng/Chiều cho dữ liệu cũ chưa có (Dựa vào giờ bắt đầu)
                if (!cls.session) {
                    if (cls.time && cls.time.match(/^(1[2-9]|2[0-3])/)) {
                        cls.session = 'Chiều'; // Nếu từ 12h trở đi là Chiều
                    } else if (cls.time && cls.time.match(/^(0?[0-9]|1[0-1])/)) {
                        cls.session = 'Sáng'; // Dưới 12h là Sáng
                    } else {
                        cls.session = index < 5 ? 'Sáng' : 'Chiều'; // Phương án dự phòng
                    }
                }

                const slot = {
                    id: 's_' + index,
                    period: cls.period,
                    time: cls.time,
                    realIndex: index 
                };
                
                if (cls.session === 'Sáng') {
                    morningSlots.push(slot);
                } else {
                    afternoonSlots.push(slot);
                }
            });

            const renderSlotsHtml = (slots) => {
                return slots.map(slot => {
                    const key = `${state.activeDay}_${slot.id}`;
                    const data = state.teachingSchedule[key] || { subject: '', teacher: '' };
                    
                    const subjectOptions = [
                        "Toán", "Tiếng Việt", "Ngữ Văn", "Vật Lí", "Hóa Học", "Sinh Học", "Khoa học tự nhiên",
                        "Lịch Sử", "Địa Lí", "Lịch sử & Địa lý", "Tiếng Anh", "Đạo đức", "GDCD", "KTPL", 
                        "Tự nhiên & Xã hội", "Khoa học", "Công Nghệ", "Tin Học", "Giáo dục thể chất", 
                        "Âm Nhạc", "Mĩ Thuật", "Nghệ Thuật", "Giáo dục QPAN", "HĐTN, HN", "GDĐP", 
                        "SHDC", "SHCN", "Phân hóa", "Tự chọn"
                    ].map(sub => `<option value="${sub}" ${data.subject === sub ? 'selected' : ''}>${sub}</option>`).join('');
                    
                    const classList = [
                        "11D"
                    ];
                    const classOptions = classList.map(cls => `<option value="${cls}" ${data.teacher === cls ? 'selected' : ''}>${cls}</option>`).join('');
                    
                    return `
                        <div class="bg-[#1e2343] border border-blue-400/20 rounded-2xl p-4 shadow-sm hover:border-blue-400/50 transition-all flex flex-col justify-between group relative">
                            <!-- NÚT XÓA TIẾT -->
                            <button onclick="deleteTeachingSlot(${state.activeDay}, ${slot.realIndex})" class="absolute -top-2 -right-2 w-6 h-6 bg-red-500 hover:bg-red-600 text-white rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity shadow-md z-10" title="Xóa tiết học này">
                                <i class="ph-bold ph-x text-[10px]"></i>
                            </button>

                            <div class="flex justify-between items-center text-blue-200 text-[11px] font-bold mb-3">
                                <span class="bg-blue-900/60 px-2.5 py-1 rounded-lg border border-blue-400/10">${slot.period}</span>
                                <span class="flex items-center gap-1 text-slate-300"><i class="ph-bold ph-clock text-amber-400"></i> ${slot.time}</span>
                            </div>
                            
                            <div class="space-y-2 mb-3">
                                <div class="relative">
                                    <select onchange="updateTeachingSlot(${state.activeDay}, '${slot.id}', 'subject', this.value)" class="w-full bg-[#141830] border border-blue-400/20 rounded-xl px-3 py-2.5 text-white font-black text-sm outline-none focus:border-amber-400 transition-colors appearance-none cursor-pointer">
                                        <option value="" class="text-slate-400">+ Chọn môn học</option>
                                        ${subjectOptions}
                                    </select>
                                    <i class="ph-bold ph-caret-down absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                                </div>
                                <div class="relative">
                                    <select onchange="updateTeachingSlot(${state.activeDay}, '${slot.id}', 'teacher', this.value)" class="w-full bg-[#141830] border border-blue-400/20 rounded-xl px-3 py-2 text-blue-200 text-xs font-bold outline-none focus:border-amber-400 transition-colors appearance-none cursor-pointer">
                                        <option value="" class="text-slate-500/70">+ Chọn lớp</option>
                                        ${classOptions}
                                    </select>
                                    <i class="ph-bold ph-caret-down absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none text-[10px]"></i>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            };

            const dayTabsHtml = days.map(day => {
                const isActive = state.activeDay === day.id;
                return `
                    <button onclick="state.activeDay = ${day.id}; renderLayout();" class="px-6 py-3 rounded-2xl text-sm font-black transition-all ${isActive ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-lg shadow-blue-500/30 scale-105' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}">
                        ${day.label}
                    </button>
                `;
            }).join('');

            let contentHtml = '';
            
            if (morningSlots.length > 0) {
                contentHtml += `
                <div class="space-y-4 relative z-10">
                    <div class="flex items-center gap-3 text-amber-400 font-black text-base uppercase tracking-wider border-b border-slate-800 pb-3">
                        <i class="ph-fill ph-sun text-2xl"></i> Buổi Sáng (${morningSlots.length} Tiết)
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4">
                        ${renderSlotsHtml(morningSlots)}
                    </div>
                </div>`;
            }

            if (afternoonSlots.length > 0) {
                contentHtml += `
                <div class="space-y-4 relative z-10 pt-4">
                    <div class="flex items-center gap-3 text-blue-400 font-black text-base uppercase tracking-wider border-b border-slate-800 pb-3">
                        <i class="ph-fill ph-moon-stars text-2xl"></i> Buổi Chiều (${afternoonSlots.length} Tiết)
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        ${renderSlotsHtml(afternoonSlots)}
                    </div>
                </div>`;
            } else if (state.activeDay === 7 && state.dailySchedule) {
                 contentHtml += `
                 <div class="p-6 mt-4 bg-slate-900/60 rounded-2xl border border-slate-800 text-center text-slate-400 italic text-sm relative z-10">
                     ☕ Thứ Bảy lớp chỉ học buổi sáng theo quy định.
                 </div>`;
            } else if (morningSlots.length > 0 && afternoonSlots.length === 0) {
                 contentHtml += `
                 <div class="p-6 mt-4 bg-slate-900/60 rounded-2xl border border-slate-800 text-center text-slate-400 italic text-sm relative z-10">
                     ☕ Không có lịch học buổi chiều.
                 </div>`;
            }

            return `
                <div class="max-w-7xl mx-auto space-y-8 animate-fade-in pb-12 pt-2">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center py-2 border-b border-slate-200 pb-6 gap-4">
                        <div>
                            <h2 class="text-2xl md:text-3xl font-black text-slate-800 tracking-tight flex items-center gap-3">
                                <div class="p-2.5 bg-blue-50 text-blueAccent rounded-xl border border-blue-100 shadow-sm"><i class="ph-fill ph-notebook text-2xl"></i></div>
                                Lịch Báo Giảng Theo Tiết
                            </h2>
                            <p class="text-slate-500 text-sm font-medium mt-1">Dùng nút xóa ở góc phải thẻ tiết học để ẩn bớt tiết trống.</p>
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-3 bg-white p-4 rounded-[2rem] shadow-sm border border-slate-200">
                        ${dayTabsHtml}
                    </div>
                    <div class="bg-[#0f172a] rounded-[2.5rem] p-6 md:p-8 shadow-xl border border-slate-800 space-y-8 relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl -mr-20 -mt-20 z-0 pointer-events-none"></div>
                        ${contentHtml}
                    </div>
                </div>
            `;
        }

        window.updateTeachingSlot = function(dayId, slotId, field, value) {
            if (!state.teachingSchedule) state.teachingSchedule = {};
            const key = `${dayId}_${slotId}`;
            if (!state.teachingSchedule[key]) state.teachingSchedule[key] = { subject: '', teacher: '' };
            state.teachingSchedule[key][field] = value.trim();
            saveData();
        };
// HÀM XÓA VÀ TỰ ĐỘNG ĐẨY SỐ THỨ TỰ LÊN TRÊN (BẢN AN TOÀN CHỐNG LỖI)
       window.deleteTeachingSlot = function(dayId, index) {
            const excelDay = dayId - 1;
            if (!state.dailySchedule || !state.dailySchedule[excelDay]) return;
            
            if (confirm("Cô có chắc muốn xóa tiết này không? Tên các tiết sẽ được đánh số lại tăng dần nhưng vẫn giữ nguyên buổi Sáng/Chiều.")) {
                state.dailySchedule[excelDay].splice(index, 1);
                
                // Cập nhật lại tên tiết cho liền mạch (VD: Sáng 4 tiết thì Chiều bắt đầu từ Tiết 5)
                state.dailySchedule[excelDay].forEach((cls, i) => {
                    cls.period = "Tiết " + (i + 1);
                });
                
                // Dịch chuyển dữ liệu môn/giáo viên đã chọn từ ô dưới lên ô trên
                for (let i = index; i <= 20; i++) {
                    let currKey = dayId + "_s_" + i;
                    let nextKey = dayId + "_s_" + (i + 1);
                    if (state.teachingSchedule[nextKey]) {
                        state.teachingSchedule[currKey] = state.teachingSchedule[nextKey];
                    } else {
                        delete state.teachingSchedule[currKey];
                    }
                }
                
                saveData();
                renderLayout();
                showToast("Đã xóa tiết và đánh số thứ tự lại thành công!", "success");
            }
        };
// ==========================================
        // --- TÍNH NĂNG NHẮC NHỞ TIẾT DẠY TỰ ĐỘNG ---
        // ==========================================
        if (!window.teachingReminderInterval) {
            window.teachingReminderInterval = setInterval(() => {
                if (!state.teachingSchedule) return;
                
                const now = new Date();
                const currentDay = now.getDay(); // 0 là Chủ Nhật, 1: Thứ 2, ..., 6: Thứ 7
                if (currentDay === 0) return; // Chủ nhật nghỉ
                
                const currentHour = now.getHours();
                const currentMinute = now.getMinutes();
                const currentTimeInMinutes = currentHour * 60 + currentMinute;
                
                // Khung giờ quy đổi ra phút để so sánh
                // Sáng: Tiết 1 (7:15), Tiết 2 (8:00), Tiết 3 (9:05), Tiết 4 (9:50), Tiết 5 (10:45)
                // Chiều: Tiết 1 (13:30), Tiết 2 (14:15), Tiết 3 (15:15)
                const slotTimes = {
                    'm1': 7 * 60 + 15,
                    'm2': 8 * 60 + 0,
                    'm3': 9 * 60 + 5,
                    'm4': 9 * 60 + 50,
                    'm5': 10 * 60 + 45,
                    'a1': 13 * 60 + 30,
                    'a2': 14 * 60 + 15,
                    'a3': 15 * 60 + 15
                };
                
                for (const slotId in slotTimes) {
                    const slotMinutes = slotTimes[slotId];
                    // Nhắc nhở trước đúng 3 phút khi chuẩn bị vào tiết
                    if (slotMinutes - currentTimeInMinutes === 3) {
                        const key = `${currentDay}_${slotId}`;
                        const lesson = state.teachingSchedule[key];
                        if (lesson && lesson.subject) {
                            showToast(`⚠️ Sắp vào tiết: ${lesson.subject} (${lesson.teacher || 'GV Bộ Môn'}) sau 3 phút nữa!`, "error");
                            if (typeof playBellSound === 'function') playBellSound(0); // Phát chuông báo
                        }
                    }
                }
            }, 60000); // Kiểm tra mỗi phút một lần
        }
// ==========================================

            return `

                        <div>

                                <div class="p-2.5 bg-rose-50 text-rose-600 rounded-xl border border-rose-100 shadow-sm"><i class="ph-fill ph-hands-clapping text-2xl"></i></div>
                                Trạm Đồng Hành

                            <p class="text-slate-500 text-sm font-medium mt-1">Nơi theo dõi, áp dụng biện pháp giáo dục đặc biệt cho học sinh vi phạm hoặc học lực yếu.</p>

        window.openEditCompanionModal = function(id) {

            const modalHtml = `

                            <button onclick="closeModal('edit-companion-modal')" class="bg-black/10 hover:bg-black/20 p-2 rounded-full transition-colors relative z-10"><i class="ph-bold ph-x text-lg"></i></button>

                                <textarea id="comp-issue" rows="4" placeholder="VD:&#10;- Thường xuyên hút thuốc trong NVS&#10;- Học lực Hóa rất yếu&#10;- Đánh nhau với bạn" class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-sm font-medium focus:border-rose-500 focus:ring-4 focus:ring-rose-100 outline-none transition-all resize-y shadow-sm leading-relaxed">${escapeHtmlAttr(companion.issue)}</textarea>

        window.saveCompanion = function() {
            if (!state.companions) state.companions = [];
            const id = document.getElementById('comp-id').value;
            const studentId = document.getElementById('comp-student').value;
            const startDate = document.getElementById('comp-date').value;
            const issue = document.getElementById('comp-issue').value.trim();
            const measures = document.getElementById('comp-measures').value.trim();

            if (!studentId) return showToast('Vui lòng chọn học sinh!', 'error');
            if (!issue) return showToast('Vui lòng nhập các lỗi hoặc vấn đề của học sinh!', 'error');

            if (id) {
                const idx = state.companions.findIndex(c => c.id == id);
                if (idx > -1) {
                    state.companions[idx] = { ...state.companions[idx], startDate, issue, measures };
                }
            } else {
                // Kiểm tra xem học sinh này đã có trong Trạm chưa
                const existing = state.companions.find(c => c.studentId == studentId);
                if(existing) return showToast('Học sinh này đang ở trong Trạm rồi, vui lòng bấm sửa Thẻ cũ!', 'error');

                state.companions.unshift({
                    id: Date.now(),
                    studentId: parseInt(studentId),
                    startDate,
                    issue,
                    measures
                });
            }
            saveData();
            renderLayout();
            closeModal('edit-companion-modal');
            showToast('Đã lưu hồ sơ Trạm Đồng Hành!', 'success');
        }

        window.deleteCompanion = function(id) {
            if (confirm('Học sinh đã hoàn toàn thay đổi tích cực và bạn muốn kết thúc quá trình đồng hành?')) {
                state.companions = state.companions.filter(c => c.id !== id);
                saveData();
                renderLayout();
                showToast('Tuyệt vời! Đã kết thúc đồng hành thành công!', 'success');
                if (typeof triggerConfetti === 'function') triggerConfetti();
            }
        }
// ==========================================
        // --- CÁC HÀM XỬ LÝ PHÂN QUYỀN VÀ ĐĂNG NHẬP ---
        // ==========================================
      /* ================= BẢNG PHONG THẦN (trang đăng nhập) ================= */
      window.openHallOfFame = function(tab) {
          state.hallOfFameTab = tab || state.hallOfFameTab || 'ca-nhan';
          if (!window._hofEscBound) {
              window._hofEscBound = true;
              document.addEventListener('keydown', function(e) {
                  if (e.key === 'Escape') window.closeHallOfFame();
              });
          }
          let modal = document.getElementById('hall-of-fame-modal');
          if (!modal) {
              modal = document.createElement('div');
              modal.id = 'hall-of-fame-modal';
              document.body.appendChild(modal);
          }
          modal.dataset.opening = '1';
          renderHallOfFame();
      };

      window.closeHallOfFame = function() {
          const modal = document.getElementById('hall-of-fame-modal');
          if (modal) modal.remove();
      };

      window.switchHallOfFameTab = function(tab) {
          state.hallOfFameTab = tab;
          state.hallOfFameGroup = null;
          renderHallOfFame();
      };

      // Bấm vào 1 tổ => xem bảng xếp hạng thành viên trong tổ đó
      window.openGroupDetail = function(groupName) {
          state.hallOfFameGroup = groupName || null;
          renderHallOfFame();
      };

      window.renderHallOfFame = function() {
          const modal = document.getElementById('hall-of-fame-modal');
          if (!modal) return;
          const tab = state.hallOfFameTab === 'theo-to' ? 'theo-to' : 'ca-nhan';
          const students = (state.students || []).slice();
          const groups = (state.groups || []).slice();

          const medal = rank => rank === 1 ? '<i class="ph-fill ph-crown"></i>' : rank === 2 ? '<i class="ph-fill ph-medal"></i>' : rank === 3 ? '<i class="ph-fill ph-medal"></i>' : `#${rank}`;
          const rankBadgeClass = rank => {
              if (rank === 1) return 'bg-gradient-to-br from-yellow-300 to-amber-500 text-amber-900 shadow-[0_6px_18px_rgba(245,158,11,0.5)]';
              if (rank === 2) return 'bg-gradient-to-br from-slate-200 to-slate-400 text-slate-800 shadow-[0_6px_18px_rgba(148,163,184,0.45)]';
              if (rank === 3) return 'bg-gradient-to-br from-orange-300 to-orange-500 text-white shadow-[0_6px_18px_rgba(249,115,22,0.45)]';
              return 'bg-white/10 text-slate-200 border border-white/10';
          };

          /* ---------- BẢNG CÁ NHÂN ---------- */
          const sortedStudents = students.sort((a, b) => (b.points || 0) - (a.points || 0) || String(a.name).localeCompare(String(b.name)));
          const top3 = sortedStudents.slice(0, 3);
          const rest = sortedStudents.slice(3);

          const podiumCard = (s, rank) => {
              const barH = rank === 1 ? 'h-28 md:h-36' : rank === 2 ? 'h-20 md:h-24' : 'h-14 md:h-20';
              const ring = rank === 1 ? 'ring-4 ring-yellow-300' : 'ring-4 ring-white/20';
              const badgeCls = rank === 1 ? 'bg-gradient-to-br from-yellow-300 to-amber-500 text-amber-900' : rank === 2 ? 'bg-gradient-to-br from-slate-200 to-slate-400 text-slate-800' : 'bg-gradient-to-br from-orange-300 to-orange-500 text-white';
              return `
                <div class="flex flex-col items-center justify-end">
                    <div class="relative mb-1.5">
                        ${getAvatarImg(s.avatarUrl, s.name, `w-14 h-14 md:w-20 md:h-20 ${ring} shadow-xl`)}
                        <div class="absolute -bottom-1 -right-1 w-6 h-6 md:w-7 md:h-7 rounded-full ${badgeCls} flex items-center justify-center text-[10px] md:text-xs font-black shadow-lg ring-2 ring-[#141235]">${rank}</div>
                    </div>
                    <div class="text-center mb-1.5 px-0.5 w-full">
                        <div class="font-black text-white text-[11px] md:text-sm truncate leading-tight">${s.name}</div>
                        <div class="text-[9px] font-bold text-amber-200/70 uppercase tracking-wider truncate">${s.group || 'Chưa nhóm'}</div>
                    </div>
                    <div class="${barH} w-full rounded-t-xl md:rounded-t-2xl ${rank === 1 ? 'bg-gradient-to-t from-amber-500/80 via-amber-400/40 to-amber-200/10 border-amber-300/60' : 'bg-gradient-to-t from-white/20 via-white/10 to-white/[0.03] border-white/20'} border-t border-x flex flex-col items-center justify-start pt-2">
                        <div class="text-lg md:text-2xl font-black text-white drop-shadow leading-none">${s.points || 0}</div>
                        <div class="text-[8px] font-bold uppercase tracking-widest text-white/50 mt-1">điểm</div>
                    </div>
                </div>`;
          };

          const podiumOrder = [top3[1], top3[0], top3[2]];
          const podiumRankOrder = [2, 1, 3];
          const podiumHtml = top3.length === 0 ? '' : `
                <div class="grid grid-cols-3 gap-2 md:gap-4 items-end mb-6">
                    ${podiumOrder.map((s, i) => s ? podiumCard(s, podiumRankOrder[i]) : '<div></div>').join('')}
                </div>`;

          const restRows = rest.map((s, i) => {
              const rank = i + 4;
              return `
                <div class="flex items-center gap-3 px-3 py-2.5 rounded-2xl bg-white/5 border border-white/10 hover:bg-white/10 transition-colors">
                    <div class="w-8 h-8 shrink-0 rounded-xl ${rankBadgeClass(rank)} flex items-center justify-center text-[11px] font-black">${rank}</div>
                    ${getAvatarImg(s.avatarUrl, s.name, 'w-9 h-9 shrink-0 ring-2 ring-white/20')}
                    <div class="flex-1 min-w-0">
                        <div class="text-sm font-bold text-white truncate">${s.name}</div>
                        <div class="text-[10px] font-bold text-white/40 uppercase tracking-wider truncate">${s.group || 'Chưa nhóm'}${s.role && s.role !== 'Thành viên' ? ' • ' + s.role : ''}</div>
                    </div>
                    <div class="text-right shrink-0">
                        <div class="text-base font-black text-amber-300">${s.points || 0}</div>
                        <div class="text-[8px] font-bold uppercase tracking-widest text-white/30">điểm</div>
                    </div>
                </div>`;
          }).join('');

          const individualHtml = `
                ${podiumHtml}
                ${top3.length === 0 ? '<div class="text-center text-white/50 font-bold italic py-16">Chưa có dữ liệu học sinh</div>' : ''}
                ${rest.length ? `<div class="space-y-2 max-h-[42vh] overflow-y-auto custom-scrollbar pr-1">${restRows}</div>` : ''}
          `;

          /* ---------- BẢNG THEO TỔ ---------- */
          const groupsWithStats = groups.map(g => {
              const members = students.filter(s => s.group === g.name);
              const totalPoints = members.reduce((sum, s) => sum + (s.points || 0), 0);
              const avg = members.length ? Math.round(totalPoints / members.length) : 0;
              const leader = members.slice().sort((a, b) => (b.points || 0) - (a.points || 0))[0];
              return { ...g, members, totalPoints, avg, leader };
          }).sort((a, b) => b.totalPoints - a.totalPoints || a.name.localeCompare(b.name));

          const maxGroupPoints = Math.max(...groupsWithStats.map(g => g.totalPoints), 1);

          const groupRows = groupsWithStats.map((g, i) => {
              const rank = i + 1;
              const pct = Math.max(0, Math.round((g.totalPoints / maxGroupPoints) * 100));
              return `
                <div onclick="openGroupDetail('${escapeInlineJs(g.name)}')" role="button" class="cursor-pointer rounded-2xl bg-white/5 border ${rank === 1 ? 'border-amber-300/50 bg-amber-400/10' : 'border-white/10'} p-3 md:p-4 hover:bg-white/10 hover:border-white/30 transition-all">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 shrink-0 rounded-xl ${rankBadgeClass(rank)} flex items-center justify-center text-sm font-black">${rank <= 3 ? medal(rank) : rank}</div>
                        ${g.avatarUrl
                            ? `<img src="${g.avatarUrl}" class="w-10 h-10 rounded-xl object-cover ring-2 ring-white/20 shrink-0">`
                            : `<div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center ring-2 ring-white/10 shrink-0"><i class="ph-fill ph-users-three text-lg ${g.color || 'text-amber-300'}"></i></div>`}
                        <div class="flex-1 min-w-0">
                            <div class="flex items-baseline gap-2">
                                <div class="font-black text-white text-sm md:text-base truncate">${g.name}</div>
                                <div class="text-[10px] font-bold text-white/40 whitespace-nowrap">${g.members.length} HS</div>
                            </div>
                            <div class="text-[10px] font-bold text-white/40 truncate">Dẫn đầu: ${g.leader ? g.leader.name : '—'}${g.leader ? ` (${g.leader.points || 0})` : ''}</div>
                        </div>
                        <div class="text-right shrink-0">
                            <div class="text-xl md:text-2xl font-black text-amber-300 leading-none">${g.totalPoints}</div>
                            <div class="text-[9px] font-bold uppercase tracking-widest text-white/30 mt-0.5">TB ${g.avg}/HS</div>
                        </div>
                        <i class="ph-bold ph-caret-right text-white/30 ml-1 shrink-0 text-sm"></i>
                    </div>
                    <div class="mt-2.5 h-2 w-full rounded-full bg-white/10 overflow-hidden">
                        <div class="h-full rounded-full bg-gradient-to-r ${rank === 1 ? 'from-amber-300 to-orange-500' : 'from-indigo-400 to-blue-400'}" style="width:${pct}%"></div>
                    </div>
                </div>`;
          }).join('');

          /* ---------- CHI TIẾT 1 TỔ: XẾP HẠNG THÀNH VIÊN ---------- */
          const currentGroup = (tab === 'theo-to' && state.hallOfFameGroup)
              ? groupsWithStats.find(g => g.name === state.hallOfFameGroup)
              : null;

          let groupDetailHtml = '';
          if (currentGroup) {
              const gRank = groupsWithStats.findIndex(g => g.name === currentGroup.name) + 1;
              const members = currentGroup.members.slice().sort((a, b) => (b.points || 0) - (a.points || 0) || String(a.name).localeCompare(String(b.name)));

              const memberRows = members.map((m, idx) => {
                  const rank = idx + 1;
                  const isTop = rank <= 3;
                  return `
                    <div class="flex items-center gap-3 px-3 py-3 rounded-2xl ${rank === 1 ? 'bg-amber-400/15 border border-amber-300/40' : 'bg-white/5 border border-white/10'} hover:bg-white/10 transition-colors">
                        <div class="w-9 h-9 shrink-0 rounded-xl ${rankBadgeClass(rank)} flex items-center justify-center text-[11px] font-black">${rank}</div>
                        ${getAvatarImg(m.avatarUrl, m.name, `w-10 h-10 shrink-0 ${isTop ? 'ring-2 ring-amber-300/70' : 'ring-2 ring-white/20'}`)}
                        <div class="flex-1 min-w-0">
                            <div class="text-sm font-bold text-white truncate">${m.name}</div>
                            <div class="text-[10px] font-bold text-white/40 uppercase tracking-wider truncate">${m.role || 'Thành viên'}${isTop ? ' • TOP ' + rank : ''}</div>
                        </div>
                        <div class="text-right shrink-0">
                            <div class="text-lg font-black ${isTop ? 'text-amber-300' : 'text-white'} leading-none">${m.points || 0}</div>

window.copyParentMessage = function(studentId) {
    const student = state.students.find(s => s.id === studentId);
    if (!student) return;

    // Sắp xếp lịch sử theo thời gian từ cũ nhất đến mới nhất
    const sortedHistory = [...(student.history || [])].sort((a, b) => new Date(a.date) - new Date(b.date));
    
    if (sortedHistory.length === 0) {
        showToast("Học sinh này chưa có ghi nhận nào!", "error");
        return;
    }

    const startDateObj = new Date(sortedHistory[0].date);
    const endDateObj = new Date(sortedHistory[sortedHistory.length - 1].date);
    
    const startDateStr = `${String(startDateObj.getDate()).padStart(2, '0')}/${String(startDateObj.getMonth()+1).padStart(2, '0')}/${startDateObj.getFullYear()}`;
    const endDateStr = `${String(endDateObj.getDate()).padStart(2, '0')}/${String(endDateObj.getMonth()+1).padStart(2, '0')}/${endDateObj.getFullYear()}`;

    let message = `Kính gửi PHHS em ${student.name},\n\nGVCN xin thông báo về tình hình rèn luyện của bạn ${student.name} từ ngày ${startDateStr} đến ngày ${endDateStr}\n\nChi tiết:\n`;
    
    let hasNegative = false;
    
    sortedHistory.forEach(h => {
        const dObj = new Date(h.date);
        const dStr = `${String(dObj.getDate()).padStart(2, '0')}/${String(dObj.getMonth()+1).padStart(2, '0')}`;
        if (h.points < 0) {
            message += `- Ngày ${dStr}: ${h.reason} (${h.points} điểm)\n`;
            hasNegative = true;
        } else {
            message += `- Ngày ${dStr}: ${h.reason} (+${h.points} điểm)\n`;
        }
    });

    message += '\n';
    if (hasNegative) {
        message += `Mong quý Phụ huynh phối hợp GVCN nhắc nhở em học tập và rèn luyện.\n`;
    } else {
        message += `Mong quý Phụ huynh tiếp tục động viên em phát huy.\n`;
    }
    
    message += `Trân trọng!`;

    navigator.clipboard.writeText(message).then(() => {
        showToast(`Đã sao chép tin nhắn của ${student.name}`, "success");
    }).catch(err => {
        showToast("Lỗi khi sao chép!", "error");
    });
};

window.setEditHistoryType = function(type) {
    window.currentEditHistoryType = type;
    const addBtn = document.getElementById('edit-history-type-add');
    const subBtn = document.getElementById('edit-history-type-sub');
    if (addBtn && subBtn) {
        if (type === 'add') {
            addBtn.className = "flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl border-2 font-bold text-sm transition-all border-emerald-500 bg-emerald-50 text-emerald-700 shadow-sm";
            subBtn.className = "flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl border-2 font-bold text-sm transition-all border-slate-200 bg-white text-slate-600 hover:bg-slate-100";
        } else {
            subBtn.className = "flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl border-2 font-bold text-sm transition-all border-red-500 bg-red-50 text-red-700 shadow-sm";
            addBtn.className = "flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl border-2 font-bold text-sm transition-all border-slate-200 bg-white text-slate-600 hover:bg-slate-100";
        }
    }
    updateEditHistoryPreview();
};

window.updateEditHistoryPreview = function() {
    const oldPoints = window.currentEditHistoryOldPoints || 0;
    const currentTotal = window.currentEditHistoryStudentTotal || 0;
    const pointsInput = document.getElementById('edit-history-points-val');
    const diffEl = document.getElementById('edit-history-diff-text');
    const totalEl = document.getElementById('edit-history-total-preview');
    if (!pointsInput || !diffEl) return;

    const val = Math.abs(parseInt(pointsInput.value) || 0);
    const newPoints = (window.currentEditHistoryType === 'add') ? val : -val;
    const diff = newPoints - oldPoints;
    const newTotal = currentTotal + diff;

    if (diff === 0) {
        diffEl.innerHTML = `<span class="text-slate-500 font-bold">Không đổi (${newPoints > 0 ? '+' : ''}${newPoints})</span>`;
    } else if (diff > 0) {
        diffEl.innerHTML = `<span class="text-emerald-600 font-black">+${diff} điểm (${oldPoints > 0 ? '+' : ''}${oldPoints} ➔ ${newPoints > 0 ? '+' : ''}${newPoints})</span>`;
    } else {
        diffEl.innerHTML = `<span class="text-red-600 font-black">${diff} điểm (${oldPoints > 0 ? '+' : ''}${oldPoints} ➔ ${newPoints})</span>`;
    }

    if (totalEl) {
        totalEl.innerHTML = `Tổng điểm học sinh: <b>${currentTotal}</b> ➔ <b class="${newTotal >= currentTotal ? 'text-emerald-600' : 'text-red-600'}">${newTotal}</b>`;
    }
};

window.saveHistoryEdit = function(studentId, recordId) {
    const student = state.students.find(s => String(s.id) === String(studentId));
    if (!student) return;
    const record = (student.history || []).find(h => String(h.id) === String(recordId));
    if (!record) return;

    const pointsInput = document.getElementById('edit-history-points-val');
    const reasonInput = document.getElementById('edit-history-reason-val');
    if (!pointsInput || !reasonInput) return;

    const val = Math.abs(parseInt(pointsInput.value) || 0);
    if (val === 0) {
        return showToast("Số điểm phải lớn hơn 0!", "error");
    }

    const newReason = reasonInput.value.trim();
    if (!newReason) {
        return showToast("Vui lòng nhập lý do!", "error");
    }

    const oldPoints = Number(record.points) || 0;
    const newPoints = (window.currentEditHistoryType === 'add') ? val : -val;
    const diff = newPoints - oldPoints;

    // 1. Cập nhật Tổng điểm và Sao
    student.points = (student.points || 0) + diff;
    student.stars = Math.max(0, (student.stars || 0) + diff);

    // 2. Cập nhật dữ liệu mục lịch sử
    record.points = newPoints;
    record.reason = newReason;
    record.updatedAt = new Date().toISOString();

    // 3. Đóng modal chỉnh sửa
    const modal = document.getElementById('edit-history-modal');
    if (modal) modal.remove();

    // 4. Lưu dữ liệu & cập nhật giao diện
    if (typeof saveData === 'function') saveData();
    renderLayout(); // Làm mới giao diện bên ngoài
    openStudentHistoryModal(student.id); // Tải lại bảng lịch sử học sinh

    showToast(`Đã cập nhật mục lịch sử thành công (${newPoints > 0 ? '+' : ''}${newPoints} điểm)!`, "success");
};

window.deleteHistoryRecord = function(studentId, recordId) {
    // 1. Tìm học sinh trong danh sách
    const student = state.students.find(s => String(s.id) === String(studentId));
    if (!student) return;

    // 2. Tìm vị trí của dòng lịch sử cần xóa (dùng String để khớp cả chuỗi lẫn số)
    const recordIndex = (student.history || []).findIndex(h => String(h.id) === String(recordId));
    if (recordIndex === -1) return;

    // 3. Hiển thị hộp thoại xác nhận
    if (confirm("Cô có chắc chắn muốn xóa lịch sử này và hoàn tác lại điểm không?")) {
        const record = student.history[recordIndex];
        
        // 4. Hoàn tác lại Tổng điểm
        student.points = (student.points || 0) - record.points;
        
        // 5. Hoàn tác lại điểm Sao (chỉ trừ đi nếu lịch sử đó là cộng điểm)
        if (record.points > 0) {
            student.stars = Math.max(0, (student.stars || 0) - record.points);
        } else {
            student.stars = (student.stars || 0) - record.points; 
        }

        // 6. Cắt bỏ dòng lịch sử đó khỏi mảng
        student.history.splice(recordIndex, 1);

        // 7. Lưu dữ liệu và tải lại giao diện
        if (typeof saveData === 'function') saveData();
        renderLayout(); // Làm mới lại bảng điểm bên ngoài trước
        openStudentHistoryModal(studentId); // Làm mới lại bảng lịch sử đang mở
        
        if (typeof showToast === 'function') {
            showToast("Đã xóa lịch sử và hoàn tác điểm!", "success");
        }
    }
};

    function tabRole() {

        return '<div class="dv-card"><h4>Vào nhanh với vai trò</h4><p>Dùng để kiểm tra giao diện từng quyền, không cần mật khẩu. Hiện tại: <b>' + esc(cur) + '</b></p>' +

            }

        return '<div class="dv-card"><h4>Giao diện</h4><div class="dv-row"><button class="dv-btn" onclick="setThemePref(\'light\');DEV.tab(\'ct\')">Sáng</button><button class="dv-btn" onclick="setThemePref(\'dark\');DEV.tab(\'ct\')">Tối</button><button class="dv-btn" onclick="setThemePref(\'auto\');DEV.tab(\'ct\')">Theo hệ thống</button></div></div>' +
            '<div class="dv-card"><h4>Chạy lệnh JavaScript</h4><p>Có thể dùng biến <code>state</code>, hàm <code>renderLayout()</code>, <code>saveData()</code>...</p>' +
            '<textarea class="dv-ta" id="dv-js" style="min-height:90px" spellcheck="false" placeholder="state.students.length"></textarea>' +

            '<div class="dv-card"><h4>Bộ nhớ trên máy (localStorage)</h4>' + rows +

            '<div class="dv-note">Xóa dữ liệu đệm không xóa dữ liệu trên Firebase. Trang sẽ tải lại và lấy dữ liệu từ mạng.</div></div>' +

                catch (e2) { r = (new Function(code))(); }

    }
    function delKey(k) { if (!confirm('Xóa khóa "' + k + '" khỏi bộ nhớ máy này?')) return; try { localStorage.removeItem(k); } catch (e) {} renderTab(); }
    function clearCache() {
        if (!confirm('Xóa dữ liệu đệm trên máy này và tải lại trang?\n(Dữ liệu trên Firebase vẫn còn)')) return;
        try { localStorage.removeItem('classManagerData'); } catch (e) {}
        location.reload();
    }
    var outlineStyle = null;
    function toggleOutline() {
        if (outlineStyle) { outlineStyle.remove(); outlineStyle = null; return; }
        outlineStyle = document.createElement('style'); outlineStyle.textContent = '#app *{outline:1px solid rgba(255,0,0,.35)!important}';
        document.head.appendChild(outlineStyle);
    }

    window.DEV = {
        submit: submit, closeLogin: closeLogin, open: openPanel, close: closePanel, lock: lock, tab: setTab,
        exportShared: function () { download('DEV_DuLieuDungChung_' + today() + '.json', JSON.stringify(getSharedState(), null, 2)); },
        exportFull: function () { download('DEV_Full_' + today() + '.json', JSON.stringify(state, null, 2)); },
        importFile: importFile, loadEditor: loadEditor, applyEditor: applyEditor,
        downloadApp: downloadApp, fbPush: fbPush, fbPull: fbPull, fbSize: fbSize, asRole: asRole,
        copyLogs: copyLogs, clearLogs: clearLogs, runJs: runJs, delKey: delKey, clearCache: clearCache, toggleOutline: toggleOutline

    if (isUnlocked()) showChip();
})();
