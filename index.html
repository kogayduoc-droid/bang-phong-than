    <!-- Giao diện sáng/tối + ghi nhận lỗi (chạy sớm để không bị nháy màu) -->
    <script>
    (function () {
        var KEY = 'uiTheme';
        var NAMES = { light: 'Sáng', dark: 'Tối', auto: 'Tự động' };
        var ICONS = { light: 'ph-sun', dark: 'ph-moon', auto: 'ph-circle-half' };
        function pref() { try { return localStorage.getItem(KEY) || 'light'; } catch (e) { return 'light'; } }
        function isDark(p) { return p === 'dark' || (p === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }
        function refresh() {
            var p = pref();
            document.querySelectorAll('[data-theme-icon]').forEach(function (el) { el.className = 'ph-bold ' + ICONS[p] + ' ' + (el.getAttribute('data-size') || 'text-lg'); });
            document.querySelectorAll('[data-theme-label]').forEach(function (el) { el.textContent = NAMES[p]; });
        }
        function apply() {
            var d = isDark(pref());
            document.documentElement.classList.toggle('dark', d);
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', d ? '#0b1220' : '#f8fafc');
            refresh();
        }
        window.getThemePref = pref;
        window.themeIconClass = function () { return 'ph-bold ' + ICONS[pref()]; };
        window.themeName = function () { return NAMES[pref()]; };
        window.applyTheme = apply;
        window.setThemePref = function (p) { try { localStorage.setItem(KEY, p); } catch (e) {} apply(); };
        window.cycleTheme = function () {
            var order = ['light', 'dark', 'auto'];
            var next = order[(order.indexOf(pref()) + 1) % order.length];
            window.setThemePref(next);
            if (typeof window.showToast === 'function') window.showToast('Giao diện: ' + NAMES[next], 'success');
        };
        document.documentElement.classList.toggle('dark', isDark(pref()));
        if (window.matchMedia) {
            var mq = window.matchMedia('(prefers-color-scheme: dark)');
            var onChange = function () { if (pref() === 'auto') apply(); };
            if (mq.addEventListener) mq.addEventListener('change', onChange); else if (mq.addListener) mq.addListener(onChange);
        }
        document.addEventListener('DOMContentLoaded', apply);

        // Ghi lại lỗi để xem trong dev mode
        var logs = window.__devLogs = [];
        function push(kind, text) {
            try { logs.push({ t: Date.now(), k: kind, m: String(text).slice(0, 2000) }); if (logs.length > 300) logs.shift(); } catch (e) {}
        }
        ['error', 'warn'].forEach(function (k) {
            var orig = console[k];
            console[k] = function () {
                try { push(k, Array.prototype.map.call(arguments, function (a) { return (a && a.stack) ? a.stack : (typeof a === 'object' ? JSON.stringify(a) : String(a)); }).join(' ')); } catch (e) {}
                return orig.apply(console, arguments);
            };
        });
        window.addEventListener('error', function (e) { push('error', (e.message || 'Lỗi') + ' @' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || '?')); });
        window.addEventListener('unhandledrejection', function (e) { push('promise', (e.reason && (e.reason.stack || e.reason.message)) || e.reason); });
    })();
    </script>

        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap');
        
       body { 
            font-family: 'Quicksand', sans-serif;
            background-color: #f1f5f9; 
            color: #0f172a; 
            margin: 0; 
            height: 100dvh; 
            overflow-x: hidden; 
            -webkit-font-smoothing: antialiased; 
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Custom Scrollbar for a premium look */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Toast Notifications */
        .toast { 
            position: fixed; bottom: 24px; right: 24px; 
            padding: 16px 24px; border-radius: 16px; 
            color: white; font-weight: 700; 
            box-shadow: 0 12px 30px rgba(0,0,0,0.15); 
            display: flex; align-items: center; gap: 12px; 
            z-index: 1000; 
            animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        }
        .toast.success { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .toast.error { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .toast.fadeOut { animation: fadeOutRight 0.3s ease-in forwards; }
        
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
        @keyframes slideInLeft { from { transform: translateX(-100%); } to { transform: translateX(0); } }
        @keyframes fadeInPlain { from { opacity: 0; } to { opacity: 1; } }
        #app { height: 100dvh; }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        /* Typography refinements */
        h1, h2, h3, h4, h5, h6 {
            letter-spacing: -0.02em;
        }
        
        .tracking-widest {
            letter-spacing: 0.1em;
        }

        /* Banner effects */
        .bg-banner { position: relative; overflow: hidden; }
        .bg-banner::before { 
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; 
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%); 
            animation: spin 40s linear infinite; pointer-events: none; 
        }
        
        /* Glassmorphism utilities */
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .glass-dark { background: rgba(30, 27, 75, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }

        /* Print adjustments */
        @media print {
            body * { visibility: hidden; }
            #report-container, #report-container * { visibility: visible; }
            #report-container { position: absolute; left: 0; top: 0; width: 100%; max-width: 100%; }
            .custom-scrollbar { overflow: visible !important; max-height: none !important; }
            .print\:hidden { display: none !important; }
        }

        function escapeInlineJs(str) { return str ? String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n').replace(/\r/g, '\\r') : ''; }
        function escapeHtmlAttr(str) { return str ? String(str).replace(/"/g, '&quot;') : ''; }
        
        function generateUniqueCode() {
            // Mỗi học sinh có mã riêng, cấp tuần tự: 11001, 11002, 11003, ... (số kế tiếp chưa ai dùng)
            const currentStudents = state.students || [];
            const used = new Set(currentStudents.map(s => String(s.code || '')));
            let max = 11000;
            currentStudents.forEach(s => {
                const c = String(s.code || '');
                if (/^11\d{3}$/.test(c)) max = Math.max(max, Number(c));
            });
            let next = max + 1;
            while (used.has(String(next)) && next <= 11999) next++;
            if (next <= 11999) return String(next);
            // Hết dãy 11xxx thì dùng số ngẫu nhiên 5 chữ số
            let code, attempts = 0;
            do { code = Math.floor(10000 + Math.random() * 90000).toString(); attempts++; } while (used.has(code) && attempts < 100);
            return code;
        }

        function compressImage(file, callback, max_size = 300, quality = 0.8) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } } 
                    else { if (height > max_size) { width *= max_size / height; height = max_size; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', quality)); 
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

    function renderViewTongQuan() {
    // --- 1. LẤY DỮ LIỆU HÔM NAY ĐỂ ĐÁNH GIÁ (YÊU CẦU 3) ---
    const d = new Date();
    const todayStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const todayRecord = state.attendanceRecords[todayStr] || {};
    
    const totalStudents = state.students.length;
    let absentCount = 0;
    let lateCount = 0;
    let todayPositiveCount = 0;
    let todayNegativeCount = 0;
    let attentionStudents = new Set();

    state.students.forEach(s => {
        // Điểm danh hôm nay
        const status = todayRecord[s.id];
        if (status === 'excused' || status === 'unexcused') {
            absentCount++;
            attentionStudents.add(s.id); // Vắng mặt cần chú ý
        } else if (status === 'late') {
            lateCount++;
            attentionStudents.add(s.id); // Đi trễ cần chú ý
        }

        // Điểm số (khen thưởng/kỷ luật) hôm nay
        if (s.history) {
            s.history.forEach(h => {
                const hDate = h.date ? h.date.split('T')[0] : '';
                if (hDate === todayStr) {
                    if (h.points > 0) todayPositiveCount++; 
                    if (h.points < 0) {
                        todayNegativeCount++; 
                        attentionStudents.add(s.id); // Vi phạm cần chú ý
                    }
                }
            });
        }
    });
    
    const presentStudents = Math.max(0, totalStudents - absentCount);
    const goodPointsCount = todayPositiveCount; 
    const needAttentionCount = attentionStudents.size;

    // Đánh giá Học tập hôm nay (100% trừ đi 5% mỗi lượt vi phạm)
    let learningPercent = 100;
    if (totalStudents > 0) {
        learningPercent = Math.max(0, 100 - (todayNegativeCount * 5));
    } else {
        learningPercent = 0;
    }

    // Đánh giá Nền nếp hôm nay
    let disciplineStatus = "Tốt";
    let disciplineColor = "text-emerald-500";
    let disciplineIcon = "🟢";
    
    if (totalStudents > 0) {
        const issueRatio = (lateCount + todayNegativeCount + absentCount) / totalStudents;
        if (issueRatio >= 0.2) { 
            disciplineStatus = "Cần cố gắng";
            disciplineColor = "text-red-500";
            disciplineIcon = "🔴";
        } else if (issueRatio > 0.05) { 
            disciplineStatus = "Khá";
            disciplineColor = "text-yellow-500";
            disciplineIcon = "🟡";

      /* ================= TRANG HỌC SINH: CHIA TỔ + TÌM KIẾM ================= */
      // Chuẩn hoá chuỗi để tìm kiếm không phân biệt dấu / hoa-thường
      window.normalizeSearch = function(str) {
          return String(str || '')
              .toLowerCase()
              .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
              .replace(/đ/g, 'd')
              .replace(/\s+/g, ' ');
      };

      // Lọc trực tiếp trên DOM (không render lại toàn trang => không mất focus ô tìm kiếm)
      window.applyStudentFilter = function() {
          const q = window.normalizeSearch(state.studentSearch || '').trim();
          const groupFilter = state.studentGroupFilter || 'all';
          let visibleCount = 0;

          document.querySelectorAll('[data-student-card]').forEach(card => {
              const hay = card.getAttribute('data-search') || '';
              const grp = card.getAttribute('data-group') || '';
              const okText = !q || hay.indexOf(q) !== -1;
              const okGroup = groupFilter === 'all' || grp === groupFilter;
              const show = okText && okGroup;
              card.style.display = show ? '' : 'none';
              if (show) visibleCount++;
          });

          // Ẩn cả khối tổ nếu không còn học sinh nào khớp
          document.querySelectorAll('[data-group-section]').forEach(sec => {
              const cards = Array.from(sec.querySelectorAll('[data-student-card]'));
              const shown = cards.filter(c => c.style.display !== 'none').length;
              sec.style.display = shown === 0 ? 'none' : '';
              const badge = sec.querySelector('[data-group-count]');
              if (badge) {
                  badge.textContent = (q || groupFilter !== 'all')
                      ? `${shown}/${cards.length} HS`
                      : `${cards.length} HS`;
              }
          });

          const resultInfo = document.getElementById('hs-result-info');
          if (resultInfo) {
              const filtering = !!(q || groupFilter !== 'all');
              resultInfo.textContent = filtering ? `Tìm thấy ${visibleCount} học sinh` : '';
              resultInfo.classList.toggle('hidden', !filtering);
          }
          const emptyState = document.getElementById('hs-empty-state');
          if (emptyState) emptyState.classList.toggle('hidden', visibleCount > 0);

          const clearBtn = document.getElementById('hs-clear-search');
          if (clearBtn) clearBtn.classList.toggle('hidden', !(state.studentSearch || ''));
      };

      window.searchStudents = function(value) {
          state.studentSearch = value;
          window.applyStudentFilter();
      };

      window.clearStudentSearch = function() {
          state.studentSearch = '';
          state.studentGroupFilter = 'all';
          const input = document.getElementById('hs-search-input');
          if (input) { input.value = ''; input.focus(); }
          document.querySelectorAll('[data-group-chip]').forEach(chip => {
              const isAll = chip.getAttribute('data-group-chip') === 'all';
              chip.className = isAll
                  ? 'hs-chip px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 bg-[#1e1b4b] text-white shadow-md'
                  : 'hs-chip px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 bg-white text-slate-600 border border-slate-200 hover:bg-slate-50';
          });
          window.applyStudentFilter();
      };

      // Lọc theo tổ bằng chip
      window.filterByGroup = function(groupName) {
          state.studentGroupFilter = groupName;
          document.querySelectorAll('[data-group-chip]').forEach(chip => {
              const isActive = chip.getAttribute('data-group-chip') === groupName;
              chip.className = isActive
                  ? 'hs-chip px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 bg-[#1e1b4b] text-white shadow-md'
                  : 'hs-chip px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 bg-white text-slate-600 border border-slate-200 hover:bg-slate-50';
          });
          window.applyStudentFilter();
      };

      // Thu gọn / mở rộng từng tổ
      window.toggleGroupCollapse = function(key) {
          if (!state.studentCollapsedGroups) state.studentCollapsedGroups = {};
          state.studentCollapsedGroups[key] = !state.studentCollapsedGroups[key];
          const body = document.getElementById('hs-group-body-' + key);
          const icon = document.getElementById('hs-group-icon-' + key);
          if (body) body.classList.toggle('hidden', !!state.studentCollapsedGroups[key]);
          if (icon) icon.style.transform = state.studentCollapsedGroups[key] ? 'rotate(-90deg)' : 'rotate(0deg)';
      };

      function renderViewHocSinh() {
        const isBGH = state.auth && state.auth.role === 'bgh';
        if (!state.studentCollapsedGroups) state.studentCollapsedGroups = {};
        if (typeof state.studentSearch !== 'string') state.studentSearch = '';
        if (!state.studentGroupFilter) state.studentGroupFilter = 'all';

        // --- Card của 1 học sinh (giữ nguyên đầy đủ chức năng cộng/trừ điểm) ---
        const renderStudentCard = (s) => {
            const group = (state.groups || []).find(g => g.name === s.group);
            let borderColorClass = 'border-slate-200';
            if (group && group.color) {
                if (group.color.includes('red')) borderColorClass = 'border-red-400';
                else if (group.color.includes('green')) borderColorClass = 'border-emerald-400';
                else if (group.color.includes('yellow')) borderColorClass = 'border-yellow-400';
                else if (group.color.includes('blue')) borderColorClass = 'border-blue-400';
                else if (group.color.includes('purple')) borderColorClass = 'border-purple-400';
            }

            const currentPoints = s.points || 0;

            let actionAreaHtml = '';
            if (isBGH) {
                actionAreaHtml = `
                    <div class="w-full mt-2 mb-6 px-4">
                        <button onclick="openStudentHistoryModal(${s.id})" class="w-full py-2.5 bg-indigo-50 text-indigo-600 font-bold rounded-xl text-xs hover:bg-indigo-100 transition-colors flex items-center justify-center gap-2 border border-indigo-100 shadow-sm">
                            <i class="ph-bold ph-clock-counter-clockwise text-sm"></i> LỊCH SỬ ĐIỂM CỘNG TRỪ
                        </button>
                    </div>
                `;
            } else {
                const positiveList = state.criteria.positive.map(c => `
                    <button onclick="executeQuickPoint(${s.id},${c.points}, '${escapeInlineJs(c.reason)}', '${escapeInlineJs(c.category)}', 'add')" class="w-full text-left px-3 py-2 text-xs font-bold text-emerald-600 hover:bg-emerald-50 rounded-lg flex justify-between items-center gap-2 transition-colors">
                        <span class="truncate">${c.reason}</span>
                        <span class="flex-shrink-0 bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded">+${c.points}</span>
                    </button>
                `).join('');
                const negativeList = state.criteria.negative.map(c => `
                    <button onclick="executeQuickPoint(${s.id},${c.points}, '${escapeInlineJs(c.reason)}', '${escapeInlineJs(c.category)}', 'subtract')" class="w-full text-left px-3 py-2 text-xs font-bold text-red-600 hover:bg-red-50 rounded-lg flex justify-between items-center gap-2 transition-colors">
                        <span class="truncate">${c.reason}</span>
                        <span class="flex-shrink-0 bg-red-100 text-red-700 px-1.5 py-0.5 rounded">-${c.points}</span>
                    </button>
                `).join('');

                actionAreaHtml = `
                    <div class="flex items-center justify-center gap-4 w-full relative mb-6 px-4">
                        <div class="relative w-full">
                            <button onclick="toggleQuickMenu(event, 'quick-minus-${s.id}')" title="Trừ điểm" class="w-full h-10 rounded-xl bg-red-50 text-red-500 flex items-center justify-center hover:bg-red-100 hover:text-red-600 transition-colors border border-red-100 font-black text-lg shadow-sm">
                                <i class="ph-bold ph-minus"></i>
                            </button>
                            <div id="quick-minus-${s.id}" class="student-dropdown hidden absolute bottom-[calc(100%+8px)] left-0 w-60 bg-white border border-red-100 shadow-[0_10px_40px_rgba(239,68,68,0.15)] rounded-2xl z-50 p-2 max-h-56 overflow-y-auto custom-scrollbar animate-slide-up">
                                <div class="text-[10px] text-red-400 font-bold uppercase tracking-widest px-2 pb-2 mb-2 border-b border-red-50 text-left">Chọn lý do trừ điểm:</div>
                                ${negativeList || '<div class="text-xs text-slate-400 italic p-2 text-center">Chưa có mẫu</div>'}
                            </div>
                        </div>
                        <div class="relative w-full">
                            <button onclick="toggleQuickMenu(event, 'quick-plus-${s.id}')" title="Cộng điểm" class="w-full h-10 rounded-xl bg-emerald-50 text-emerald-500 flex items-center justify-center hover:bg-emerald-100 hover:text-emerald-600 transition-colors border border-emerald-100 font-black text-lg shadow-sm">
                                <i class="ph-bold ph-plus"></i>
                            </button>
                            <div id="quick-plus-${s.id}" class="student-dropdown hidden absolute bottom-[calc(100%+8px)] right-0 w-60 bg-white border border-emerald-100 shadow-[0_10px_40px_rgba(16,185,129,0.15)] rounded-2xl z-50 p-2 max-h-56 overflow-y-auto custom-scrollbar animate-slide-up">
                                <div class="text-[10px] text-emerald-500 font-bold uppercase tracking-widest px-2 pb-2 mb-2 border-b border-emerald-50 text-left">Chọn lý do cộng điểm:</div>
                                ${positiveList || '<div class="text-xs text-slate-400 italic p-2 text-center">Chưa có mẫu</div>'}
                            </div>
                        </div>
                    </div>
                `;
            }

            const searchIndex = window.normalizeSearch([s.name, s.code, s.role, s.group].join(' '));

            return `
            <div data-student-card data-group="${escapeHtmlAttr(s.group || '')}" data-search="${escapeHtmlAttr(searchIndex)}"
                 class="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-200 border-t-4 border-t-${borderColorClass.replace('border-', '')} flex flex-col items-center relative hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">

                <div class="absolute top-4 right-4 z-20">
                    <button onclick="toggleStudentMenu(event, ${s.id})" class="text-slate-300 hover:text-slate-600 p-1 rounded-full focus:outline-none transition-colors"><i class="ph-bold ph-dots-three-vertical text-xl"></i></button>
                    <div id="student-menu-${s.id}" class="student-dropdown hidden absolute right-0 mt-1 w-40 bg-white rounded-xl shadow-[0_10px_40px_rgba(0,0,0,0.1)] border border-slate-100 overflow-hidden z-30 p-2 animate-fade-in">
                        <button onclick="openStudentHistoryModal(${s.id})" class="w-full text-left px-3 py-2.5 text-sm text-emerald-600 hover:bg-slate-50 rounded-lg font-bold flex items-center gap-2.5"><i class="ph-bold ph-clock-counter-clockwise text-lg"></i> Lịch sử</button>
                        ${state.auth.role === 'gvcn' ? `<button onclick="deleteStudent(${s.id})" class="w-full text-left px-3 py-2.5 text-sm text-red-600 hover:bg-slate-50 rounded-lg font-bold flex items-center gap-2.5"><i class="ph-fill ph-trash text-lg"></i> Xóa</button>` : ''}
                    </div>
                </div>

                ${getAvatarImg(s.avatarUrl, s.name, "w-24 h-24 mb-4 mt-2 ring-4 ring-slate-50 shadow-md")}
                <div class="font-black text-slate-800 text-xl mb-2 truncate w-full text-center">${s.name}</div>
                <div class="flex flex-wrap items-center justify-center gap-2 mb-2">
                    <span class="text-[10px] font-bold text-slate-500 bg-slate-100 px-3 py-1 rounded-md uppercase border border-slate-200">${s.group || 'Chưa nhóm'}</span>
                    <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-md border border-blue-100">${s.role || 'Thành viên'}</span>
                </div>
                ${s.code ? `<div class="text-[10px] font-bold text-slate-400 mb-2 tracking-wider">MÃ: ${s.code}</div>` : ''}
                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 mt-2">TỔNG ĐIỂM</div>
                <div class="text-4xl font-black text-[#1e1b4b] mb-6">${currentPoints}</div>${actionAreaHtml}

                <button ${isBGH ? '' : `onclick="openEditStudentModal(${s.id})"`} class="w-full py-3 bg-slate-50 text-slate-600 font-bold rounded-xl text-xs flex items-center justify-center gap-2 border border-slate-200 mt-auto ${isBGH ? 'cursor-not-allowed opacity-70' : 'hover:bg-slate-100 transition-colors'}">
                    <i class="ph-bold ${isBGH ? 'ph-eye' : 'ph-identification-card'} text-sm"></i> ${isBGH ? 'CHỈ XEM HỒ SƠ' : 'XEM HỒ SƠ'}
                </button>
            </div>
            `;
        };

        // --- Gom học sinh theo tổ (theo danh sách Tổ trong Cài đặt) ---
        const allGroups = state.groups || [];
        const buckets = allGroups.map(g => ({
            key: 'grp_' + String(g.id).replace(/[^a-zA-Z0-9_-]/g, ''),
            name: g.name,
            color: g.color || 'text-slate-500',
            avatarUrl: g.avatarUrl || '',
            students: []
        }));

        const otherBucket = { key: 'khac', name: 'Chưa xếp tổ', color: 'text-slate-400', avatarUrl: '', students: [] };

        state.students.forEach(s => {
            const bucket = buckets.find(b => b.name === s.group);
            (bucket || otherBucket).students.push(s);
        });
        if (otherBucket.students.length > 0) buckets.push(otherBucket);

        buckets.forEach(b => b.students.sort((a, b2) => (b2.points || 0) - (a.points || 0)));

        const totalFiltered = buckets.reduce((n, b) => n + b.students.length, 0);

        const chipsHtml = `
            <button data-group-chip="all" onclick="filterByGroup('all')" class="hs-chip px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 ${state.studentGroupFilter === 'all' ? 'bg-[#1e1b4b] text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}">
                <i class="ph-fill ph-squares-four"></i> Tất cả <span class="opacity-70">(${state.students.length})</span>
            </button>
            ${allGroups.map(g => {
                const count = state.students.filter(s => s.group === g.name).length;
                const active = state.studentGroupFilter === g.name;
                return `<button data-group-chip="${escapeHtmlAttr(g.name)}" onclick="filterByGroup('${escapeInlineJs(g.name)}')" class="hs-chip px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 ${active ? 'bg-[#1e1b4b] text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}">
                    <i class="ph-fill ph-users-three ${active ? '' : g.color || 'text-slate-400'}"></i> ${g.name} <span class="opacity-70">(${count})</span>
                </button>`;
            }).join('')}
        `;

        const sectionsHtml = buckets.map(b => {
            const isCollapsed = !!state.studentCollapsedGroups[b.key];
            const totalPoints = b.students.reduce((sum, s) => sum + (s.points || 0), 0);
            return `
            <section data-group-section="${escapeHtmlAttr(b.key)}" class="animate-fade-in">
                <div class="flex flex-wrap items-center justify-between gap-3 mb-4 pb-3 border-b border-slate-200">
                    <button onclick="toggleGroupCollapse('${b.key}')" class="flex items-center gap-3 group text-left">
                        <span id="hs-group-icon-${b.key}" class="text-slate-400 transition-transform duration-300" style="display:inline-block; transform: rotate(${isCollapsed ? '-90deg' : '0deg'});">
                            <i class="ph-bold ph-caret-down text-base"></i>
                        </span>
                        ${b.avatarUrl
                            ? `<img src="${b.avatarUrl}" class="w-11 h-11 rounded-2xl object-cover shadow-sm ring-2 ring-white">`
                            : `<div class="w-11 h-11 rounded-2xl bg-white flex items-center justify-center shadow-sm ring-2 ring-slate-100 border border-slate-100"><i class="ph-fill ph-users-three text-xl ${b.color}"></i></div>`}
                        <div>
                            <h3 class="font-black text-slate-800 text-lg tracking-tight leading-none group-hover:text-[#1e1b4b] transition-colors">${b.name}</h3>
                            <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mt-1 flex items-center gap-2">
                                <span data-group-count>${b.students.length} HS</span>
                                <span class="text-slate-300">•</span>
                                <span>Tổng ${totalPoints} điểm</span>
                            </div>
                        </div>
                    </button>
                    <div class="flex items-center gap-2">
                        <button onclick="filterByGroup('${escapeInlineJs(b.name)}')" class="px-3 py-2 rounded-xl text-[11px] font-bold bg-slate-50 text-slate-500 border border-slate-200 hover:bg-slate-100 transition-colors flex items-center gap-1.5">
                            <i class="ph-bold ph-funnel"></i> Chỉ xem tổ này
                        </button>
                        <button onclick="toggleGroupCollapse('${b.key}')" class="px-3 py-2 rounded-xl text-[11px] font-bold bg-white text-slate-500 border border-slate-200 hover:bg-slate-50 transition-colors">
                            ${isCollapsed ? 'Mở rộng' : 'Thu gọn'}
                        </button>
                    </div>
                </div>
                <div id="hs-group-body-${b.key}" class="${isCollapsed ? 'hidden' : ''}">
                    ${b.students.length === 0
                        ? `<div class="text-xs text-slate-400 font-medium italic text-center py-8 bg-slate-50/50 rounded-2xl border border-dashed border-slate-200">Tổ này chưa có thành viên nào</div>`
                        : `<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-6 xl:gap-8">${b.students.map(renderStudentCard).join('')}</div>`}
                </div>
            </section>
            `;
        }).join('');

        return `
            <div class="max-w-7xl mx-auto animate-fade-in space-y-6 pb-12" onclick="closeAllStudentMenus()">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center py-2 border-b border-slate-200 pb-6 gap-4">
                  <div>
                        <h2 class="text-2xl md:text-3xl font-black text-slate-800 tracking-tight flex items-center gap-3">
                            Quản lí Học sinh
                            <span class="bg-blue-100 text-blue-700 text-[13px] px-3 py-1 rounded-full border border-blue-200 shadow-inner font-bold tracking-wide">Sĩ số: ${state.students.length}</span>
                        </h2>
                        <p class="text-xs font-bold text-slate-400 mt-1 flex items-center gap-1.5"><i class="ph-fill ph-users-three"></i> ${buckets.length} tổ • ${state.students.length} học sinh</p>
                    </div>
                  <div class="flex gap-3 w-full sm:w-auto">
                        ${!isBGH ? `
                        <button onclick="openEditStudentModal(null)" class="flex-1 sm:flex-none px-5 py-3 bg-[#0f172a] text-white font-bold rounded-xl text-sm shadow-md hover:bg-black transition-colors flex items-center justify-center gap-2"><i class="ph-bold ph-user-plus text-lg"></i> Thêm HS</button>
                        <button onclick="downloadTemplate()" class="flex-1 sm:flex-none px-5 py-3 bg-white text-slate-600 border border-slate-200 font-bold rounded-xl text-sm shadow-sm hover:bg-slate-50 transition-colors flex items-center justify-center gap-2"><i class="ph-fill ph-download-simple text-green-600 text-lg"></i> File mẫu</button>
                        <button onclick="openImportModal()" class="flex-1 sm:flex-none px-5 py-3 bg-blue-50 text-blue-700 border border-blue-100 font-bold rounded-xl text-sm shadow-sm hover:bg-blue-100 transition-colors flex items-center justify-center gap-2"><i class="ph-bold ph-upload-simple text-lg"></i> Nhập DS</button>
                        ` : ''}
                    </div>
                </div>

                <!-- THANH TÌM KIẾM + LỌC TỔ -->
                <div class="sticky top-0 z-30 -mx-4 md:mx-0 px-4 md:px-0 py-3 bg-[#f8fafc]/95 backdrop-blur-sm">
                    <div class="bg-white rounded-[1.6rem] border border-slate-200 shadow-sm p-4 md:p-5 space-y-3">
                        <div class="flex flex-col md:flex-row md:items-center gap-3">
                            <div class="relative w-full">
                                <i class="ph-bold ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                                <input id="hs-search-input" type="text" value="${escapeHtmlAttr(state.studentSearch || '')}"
                                       oninput="searchStudents(this.value)"
                                       placeholder="Tìm theo tên, mã tra cứu, chức vụ hoặc tổ..."
                                       class="w-full pl-12 pr-12 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold text-slate-800 placeholder:font-medium placeholder:text-slate-400 outline-none focus:bg-white focus:border-[#1e1b4b] focus:ring-4 focus:ring-indigo-50 transition-all">
                                <button id="hs-clear-search" onclick="clearStudentSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-slate-200 text-slate-600 hover:bg-slate-300 flex items-center justify-center transition-colors"><i class="ph-bold ph-x text-sm"></i></button>
                            </div>
                            <div id="hs-result-info" class="text-[11px] font-bold text-slate-400 whitespace-nowrap md:text-right ${(state.studentSearch || state.studentGroupFilter !== 'all') ? '' : 'hidden'}"></div>
                        </div>
                        <div class="flex flex-wrap items-center gap-2">${chipsHtml}</div>
                    </div>
                </div>

                <div id="hs-groups-root" class="space-y-10">
                    ${sectionsHtml || '<div class="text-center py-16 text-slate-400 font-bold italic">Chưa có học sinh nào trong lớp</div>'}
                </div>

                <div id="hs-empty-state" class="hidden text-center py-16">
                    <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-slate-100 flex items-center justify-center"><i class="ph-bold ph-magnifying-glass text-3xl text-slate-300"></i></div>
                    <div class="font-black text-slate-500 text-lg mb-1">Không tìm thấy học sinh phù hợp</div>
                    <div class="text-sm font-medium text-slate-400 mb-4">Thử từ khoá khác hoặc bỏ lọc theo tổ.</div>
                    <button onclick="clearStudentSearch()" class="px-5 py-2.5 bg-[#1e1b4b] text-white font-bold rounded-xl text-xs hover:bg-secondary transition-colors">Xoá bộ lọc</button>
                </div>
            </div>
        `;
      }
        function renderViewTichDiem() {
            const pf = state.pointsForm;
            const isAdd = pf.actionType === 'add';
            const sign = isAdd ? '+' : '-';
            
            // --- Helper styling classes ---
            const actionBtnClass = (active, isAddBtn) => {
                if (!active) return "bg-white text-slate-500 border border-slate-200 hover:bg-slate-50 shadow-sm";
                if (isAddBtn) return "bg-emerald-600 text-white border border-emerald-700 shadow-md transform scale-105 z-10";
                return "bg-red-50 text-red-600 border border-red-200 shadow-inner transform scale-105 z-10 font-bold";
            };

            const targetBtnClass = (active) => {
                if (!active) return "bg-white text-slate-500 border border-slate-200 hover:bg-slate-50";
                return "bg-purple-600 text-white border border-purple-700 shadow-md font-bold";
            };

            // --- Dropdown Target Selection ---
            let targetSelectHtml = '';
            if (pf.targetType === 'student') {
                targetSelectHtml = `
                    <div class="mb-6 animate-fade-in">
                        <label class="block text-xs font-bold text-slate-600 mb-2 uppercase tracking-wide">Chọn Học Sinh:</label>
                        <div class="relative">
                            <select onchange="updatePointsForm('selectedTargetId', this.value)" class="w-full px-5 py-3.5 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-800 focus:outline-none focus:border-purple-500 focus:ring-4 focus:ring-purple-100 transition-all appearance-none cursor-pointer shadow-sm">
                                <option value="">-- Chọn học sinh --</option>
                                ${[...state.students].sort((a,b) => a.name.localeCompare(b.name)).map(s => 
                                                                       `<option value="${s.id}" ${pf.selectedTargetId == s.id ? 'selected' : ''}>${s.name} (${s.group} | ${s.points}đ)</option>`
                                ).join('')}
                            </select>
                            <i class="ph-bold ph-caret-down absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xl"></i>
                        </div>
                    </div>
                `;
            } else if (pf.targetType === 'group') {
                targetSelectHtml = `
                    <div class="mb-6 animate-fade-in">
                        <label class="block text-xs font-bold text-slate-600 mb-2 uppercase tracking-wide">Chọn Nhóm/Tổ:</label>
                        <div class="relative">
                            <select onchange="updatePointsForm('selectedTargetId', this.value)" class="w-full px-5 py-3.5 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-800 focus:outline-none focus:border-purple-500 focus:ring-4 focus:ring-purple-100 transition-all appearance-none cursor-pointer shadow-sm">
                                <option value="">-- Chọn nhóm/tổ --</option>
                                ${state.groups.map(g => 
                                    `<option value="${g.name}" ${pf.selectedTargetId === g.name ? 'selected' : ''}>${g.name}</option>`
                                ).join('')}
                            </select>
                            <i class="ph-bold ph-caret-down absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xl"></i>
                        </div>
                    </div>
                `;
            } else {
                targetSelectHtml = `
                    <div class="mb-6 p-4 bg-purple-50 border border-purple-100 rounded-xl animate-fade-in flex items-center gap-3">
                        <div class="p-2 bg-purple-200 text-purple-700 rounded-lg"><i class="ph-fill ph-users-three text-xl"></i></div>
                        <div>
                            <div class="font-bold text-purple-800 text-sm">Áp dụng cho Cả Lớp</div>
                            <div class="text-[11px] text-purple-600 mt-0.5">Điểm sẽ được cập nhật cho tất cả ${state.students.length} học sinh.</div>
                        </div>
                    </div>
                `;
            }

      window.executeQuickPoint = function(studentId, points, reason, category, type) {
    const student = state.students.find(s => s.id === studentId);
    if (!student) return;
    
    const pointsToApply = type === 'add' ? points : -points;
    const actorName = (state.auth && state.auth.role === 'bcs') ? 'Ban Cán Sự' : 'GVCN';
    
    student.points = (student.points || 0) + pointsToApply; 
    student.stars = Math.max(0, (student.stars || 0) + pointsToApply);
    
    if (!student.history) student.history = [];
    student.history.push({
        id: Date.now(),
        date: new Date().toISOString(),
        points: pointsToApply,
        reason: reason + ` [${category}]`,
        actor: actorName
    });
    
    saveData();
    renderLayout(); 
    showToast(`Đã ${type === 'add' ? 'cộng' : 'trừ'} ${points} điểm cho ${student.name}`, type === 'add' ? 'success' : 'error');
    if (type === 'add' && typeof triggerConfetti === 'function') triggerConfetti();
};

window.executePointsSubmission = function() {
    const pf = state.pointsForm;
    const pointsToApply = pf.actionType === 'add' ? parseInt(pf.pointsVal) : -parseInt(pf.pointsVal);
    
    if (isNaN(pointsToApply) || pointsToApply === 0) return showToast("Số điểm không hợp lệ!", "error");
    if (!pf.reason.trim()) return showToast("Vui lòng nhập lý do!", "error");
    
    let targetStudents = [];
    let successMsg = "";
    
    if (pf.targetType === 'student') {
        const s = state.students.find(x => x.id.toString() === pf.selectedTargetId.toString());
        if (!s) return showToast("Vui lòng chọn học sinh!", "error");
        targetStudents.push(s);
        successMsg = `Đã ${pf.actionType === 'add' ? 'cộng' : 'trừ'} ${Math.abs(pointsToApply)} điểm cho ${s.name}`;
    } 
    else if (pf.targetType === 'group') {
        targetStudents = state.students.filter(x => x.group === pf.selectedTargetId);
        if (targetStudents.length === 0) return showToast(`Nhóm ${pf.selectedTargetId} chưa có học sinh!`, "error");
        successMsg = `Đã ${pf.actionType === 'add' ? 'cộng' : 'trừ'} ${Math.abs(pointsToApply)} điểm cho Tổ ${pf.selectedTargetId}`;
    } 
    else if (pf.targetType === 'class') {
        targetStudents = [...state.students];
        if (targetStudents.length === 0) return showToast("Lớp chưa có học sinh!", "error");
        successMsg = `Đã ${pf.actionType === 'add' ? 'cộng' : 'trừ'} ${Math.abs(pointsToApply)} điểm cho Toàn Lớp`;
    }
    
    const currentReason = pf.reason.trim();
    const actorName = (state.auth && state.auth.role === 'bcs') ? 'Ban Cán Sự' : 'GVCN';
    
    const historyEntry = {
        id: Date.now(),
        date: new Date().toISOString(),
        points: pointsToApply,
        reason: currentReason + (pf.note ? ` (${pf.note.trim()})` : '') + ` [${pf.category}]`,
        actor: actorName
    };
    
    targetStudents.forEach(s => {
        s.points = (s.points || 0) + pointsToApply;
        s.stars = Math.max(0, (s.stars || 0) + pointsToApply);
        if (!s.history) s.history = [];
        s.history.push({...historyEntry, id: Date.now() + Math.random()}); 
    });
    saveData();
    
    state.pointsForm.pointsVal = 0;
    state.pointsForm.reason = '';
    state.pointsForm.note = '';
    
    renderLayout();
    showToast(successMsg, pointsToApply > 0 ? "success" : "error");
    if (pointsToApply > 0) triggerConfetti();
};

     function renderViewNhomThiDua() {
            const timeframe = state.groupRankingTimeframe || 'tong';

            // Hàm kiểm tra lịch sử có nằm trong tuần này không
            const isThisWeek = (dateString) => {
                if (!dateString) return false;
                const d = new Date(dateString);
                const now = new Date();
                const day = now.getDay();
                const diff = now.getDate() - day + (day === 0 ? -6 : 1);
                const monday = new Date(now.getFullYear(), now.getMonth(), diff);
                monday.setHours(0,0,0,0);
                return d >= monday;
            };

            // Hàm kiểm tra lịch sử có nằm trong tháng này không
            const isThisMonth = (dateString) => {
                if (!dateString) return false;
                const d = new Date(dateString);
                const now = new Date();
                return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
            };

            // Hàm tính điểm động theo bộ lọc
            const getStudentPoints = (student) => {
                if (timeframe === 'tong') return Number(student.points) || 0;
                let sum = 0;
                if (student.history) {
                    student.history.forEach(h => {
                        if (h.date) {
                            if (timeframe === 'tuan' && isThisWeek(h.date)) sum += Number(h.points);
                            if (timeframe === 'thang' && isThisMonth(h.date)) sum += Number(h.points);
                        }
                    });
                }
                return sum;
            };

            // Lấy danh sách và tự động xếp hạng Tổ
            let groupsWithStats = state.groups.map(g => {
                const members = state.students.filter(s => s.group === g.name).map(s => {
                    return { ...s, calculatedPoints: getStudentPoints(s) };
                });
                const totalPoints = members.reduce((sum, s) => sum + s.calculatedPoints, 0);
                return { ...g, members, totalPoints };
            });

        const ATTENDANCE_POINTS = {
            'present': { val: 1, reason: 'Có mặt' }, 
            'late': { val: -2, reason: 'Đi học muộn' },
            'excused': { val: -1, reason: 'Nghỉ có phép' },
            'unexcused': { val: -3, reason: 'Nghỉ không phép' }
        };
        window.applyAttendancePoints = function(studentId, status, dateStr) {
            const student = state.students.find(s => String(s.id) === String(studentId));
            if (!student) return;
            const config = ATTENDANCE_POINTS[status];
            if (!config || config.val === 0) return;
            student.points = Number(student.points || 0) + config.val;
            student.stars = Math.max(0, Number(student.stars || 0) + config.val);
            if (!student.history) student.history = [];
            student.history.push({
                id: `att_${dateStr}_${status}_${Date.now()}`,
                date: new Date().toISOString(),
                points: config.val,
                reason: config.reason + ` [Chuyên cần]`,
                isAttendance: true,
                attDate: dateStr,
                attStatus: status
            });
        };
        
        window.revertAttendancePoints = function(studentId, oldStatus, dateStr) {
            const student = state.students.find(s => String(s.id) === String(studentId));
            if (!student) return;
            const config = ATTENDANCE_POINTS[oldStatus];
            if (!config || config.val === 0) return;
            student.points = Number(student.points || 0) - config.val;
            student.stars = Math.max(0, Number(student.stars || 0) - config.val);
            if (student.history) {
                const idx = student.history.findIndex(h => h.isAttendance && h.attDate === dateStr && h.attStatus === oldStatus);
                if (idx > -1) {
                    student.history.splice(idx, 1);
                }
            }
        };
        
        window.markAttendance = function(id, status) {
            const recordKey = currentAttendanceDate + '_' + window.currentAttendanceSession;
            if (!state.attendanceRecords[recordKey]) state.attendanceRecords[recordKey] = {};
            const oldStatus = state.attendanceRecords[recordKey][id];
            
            if (oldStatus === status) {
                delete state.attendanceRecords[recordKey][id];
                window.revertAttendancePoints(id, oldStatus, recordKey);
            } else {
                if (oldStatus) window.revertAttendancePoints(id, oldStatus, recordKey);
                state.attendanceRecords[recordKey][id] = status;
                window.applyAttendancePoints(id, status, recordKey);
            }
            
            const stu = state.students.find(s => String(s.id) === String(id));
            const statusText = status === 'present' ? 'Có mặt' : status === 'late' ? 'Đi muộn' : status === 'excused' ? 'Vắng (P)' : 'Vắng (KP)';
            if(stu && typeof logBCSAction === 'function') logBCSAction(`Điểm danh ${stu.name} (${window.currentAttendanceSession}): ${statusText}`);
            saveData(); 
            renderLayout();
        };

            state.students.forEach(s => {

// --- XUẤT FILE EXCEL TOP VI PHẠM ---
        window.exportTopViPhamExcel = function() {

                    const diff = now.getDate() - day + (day === 0 ? -6 : 1);
                    const monday = new Date(now.getFullYear(), now.getMonth(), diff);
                    monday.setHours(0,0,0,0);
                    return d >= monday;
                }
                if (filter === 'thang') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                if (filter === 'hk1') return (d.getMonth() + 1 >= 8 && d.getMonth() + 1 <= 12) && d.getFullYear() === (now.getMonth() < 7 ? now.getFullYear() - 1 : now.getFullYear());
                if (filter === 'hk2') return (d.getMonth() + 1 >= 1 && d.getMonth() + 1 <= 5) && d.getFullYear() === (now.getMonth() > 5 ? now.getFullYear() + 1 : now.getFullYear());
                return true;
            };

                    if (isDateInFilter(dateStr)) {
                        const status = state.attendanceRecords[recordKey][s.id];
                        if (status === 'late') { late++; total++; }
                        if (status === 'excused') { excused++; total++; }
                        if (status === 'unexcused') { unexcused++; total += 2; }
                    }
                });
                return { ...s, late, excused, unexcused, totalViPham: total };
            }).filter(s => s.totalViPham > 0).sort((a, b) => b.totalViPham - a.totalViPham);

            if (studentStats.length === 0) {
                return showToast("Không có học sinh nào vi phạm để xuất file!", "error");
            }

            // Tạo dữ liệu cho file Excel
            const data = [
                ["BẢNG THỐNG KÊ HỌC SINH VẮNG/TRỄ (Đã gộp Sáng/Chiều)"], // Dòng tiêu đề
                [], // Dòng trống
                ["STT", "Họ và Tên", "Tổ", "Đi Trễ", "Vắng (Phép)", "Vắng (Không Phép)", "Điểm Phạt Tạm Tính"]

            // Định dạng và xuất file
            const ws = XLSX.utils.aoa_to_sheet(data);

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "DS_Vi_Pham");
            
            const filterNames = { 'tuan': 'TuanNay', 'thang': 'ThangNay', 'hk1': 'HocKi1', 'hk2': 'HocKi2', 'tong': 'TongCaNam' };
            const fileName = `Top_Vi_Pham_Chuyen_Can_${filterNames[filter]}_${getTodayString()}.xlsx`;
            
            XLSX.writeFile(wb, fileName);
            showToast("Đã tải xuống file Excel! Cô có thể mở ra để in nhé.", "success");
        };
// --- NEW RANDOM PICKER ENGINE VARIABLES ---
        let pickerMode = 'chaos'; // chaos, spiral, wave, planet, figure8, bubbles

        }

        window.changePickerMode = function(mode) { pickerMode = mode; renderLayout(); }
        window.changePickerBg = function(bg) { pickerBg = bg; renderLayout(); }
        window.changePickTarget = function(target) { pickTarget = target; renderLayout(); }

        function initPickerCards() {
            const stage = document.getElementById('picker-stage');
            if (!stage) return;
            stage.innerHTML = ''; // Clear old cards
            
            const listItems = pickTarget === 'student' ? state.students : state.groups;
            if(listItems.length === 0) {
                stage.innerHTML = `<div class="absolute inset-0 flex items-center justify-center text-xl font-bold ${pickerBg === 'default' ? 'text-slate-400' : 'text-white/50'}">Chưa có dữ liệu.</div>`;

            }

            pickerItems = listItems.map((item, index) => {
                const el = document.createElement('div');
                el.className = `absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white rounded-2xl p-3 shadow-lg flex flex-col items-center justify-center gap-2 border border-slate-100 will-change-transform z-10`;
                el.style.width = '110px';
                el.style.height = '130px';
                
                // Color theme for avatar border
                const colors = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6'];
                const borderColor = colors[index % colors.length];

                let avatarHtml = '';
                if(pickTarget === 'student') {
                    avatarHtml = getAvatarImg(item.avatarUrl, item.name, "w-16 h-16 pointer-events-none ring-4 ring-white");
                } else {
                    avatarHtml = item.avatarUrl ? `<img src="${item.avatarUrl}" class="w-16 h-16 rounded-full object-cover ring-4 ring-white pointer-events-none">` : `<div class="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center ring-4 ring-white"><i class="ph-fill ph-users-three text-3xl text-slate-400"></i></div>`;
                }

                el.innerHTML = `
                    <div class="rounded-full p-1" style="background: linear-gradient(135deg, ${borderColor} 0%, transparent 100%);">
                        ${avatarHtml}
                    </div>
                    <div class="text-xs font-black text-slate-800 text-center w-full truncate leading-tight pointer-events-none">${item.name}</div>
                `;
                
                stage.appendChild(el);

                // Initial random positions
                const stageWidth = stage.offsetWidth;
                const stageHeight = stage.offsetHeight;
                
                return {
                    el: el,
                    data: item,
                    x: (Math.random() - 0.5) * (stageWidth - 150),
                    y: (Math.random() - 0.5) * (stageHeight - 150),
                    angle: Math.random() * Math.PI * 2,
                    speed: 0.5 + Math.random() * 1.5,
                    radius: 50 + Math.random() * 200, // for spiral/planet
                    baseX: 0, baseY: 0 // offset
                };
            });
        }

        function animatePicker() {
            if(!pickerItems.length) return;
            if (document.hidden) { pickerAnimationId = requestAnimationFrame(animatePicker); return; }
            const stage = document.getElementById('picker-stage');
            if (!stage) { cancelAnimationFrame(pickerAnimationId); return; }
            
            const stageWidth = stage.offsetWidth;
            const stageHeight = stage.offsetHeight;
            const time = performance.now() / 1000; // time in seconds

            pickerItems.forEach((item, i) => {
                // Tốc độ thay đổi dựa trên việc có đang Pick (quay số) hay không
                const speedMulti = isPicking ? 8 : 1; 

                if (pickerMode === 'chaos') {
                    item.x += Math.cos(item.angle) * item.speed * speedMulti;
                    item.y += Math.sin(item.angle) * item.speed * speedMulti;
                    // Bouncing off walls
                    const boundX = stageWidth/2 - 60;
                    const boundY = stageHeight/2 - 70;
                    if (item.x > boundX || item.x < -boundX) item.angle = Math.PI - item.angle;
                    if (item.y > boundY || item.y < -boundY) item.angle = -item.angle;
                    
                    // Add some random noise
                    item.angle += (Math.random() - 0.5) * 0.1 * speedMulti;
                } 
                else if (pickerMode === 'spiral') {
                    const t = time * item.speed * speedMulti + i;
                    const r = (Math.sin(time * 0.5) * 0.5 + 0.5) * 300 + 50; // Radius expands and contracts
                    item.x = Math.cos(t) * r;
                    item.y = Math.sin(t) * r;
                }
                else if (pickerMode === 'planet') {
                    // Center is sun, others orbit
                    const t = time * (item.speed/2) * speedMulti;
                    item.x = Math.cos(t + i) * item.radius;
                    item.y = Math.sin(t + i) * item.radius;
                }
                else if (pickerMode === 'wave') {
                    item.x += item.speed * speedMulti * 2;
                    if(item.x > stageWidth/2 + 60) item.x = -stageWidth/2 - 60; // wrap around
                    item.y = Math.sin(item.x / 100 + time * 5) * 150;
                }
                else if (pickerMode === 'bubbles') {
                    item.y -= item.speed * speedMulti * 2;
                    if(item.y < -stageHeight/2 - 70) item.y = stageHeight/2 + 70;
                    item.x = Math.sin(item.y / 50 + time * 3 + i) * 100 + item.baseX;
                }
                else if (pickerMode === 'figure8') {
                    const t = time * item.speed * speedMulti + i;
                    item.x = Math.sin(t) * (stageWidth/3);
                    item.y = Math.sin(t) * Math.cos(t) * (stageHeight/3);
                }

                // Keep within bounds roughly
                item.x = Math.max(-stageWidth/2 + 55, Math.min(stageWidth/2 - 55, item.x));
                item.y = Math.max(-stageHeight/2 + 65, Math.min(stageHeight/2 - 65, item.y));

                // Apply transform relative to center
                item.el.style.transform = `translate3d(calc(-50% + ${item.x}px), calc(-50% + ${item.y}px), 0)`;
            });

            if(!isPicking || performance.now() < pickEndTime) {
                pickerAnimationId = requestAnimationFrame(animatePicker);
            }
        }

        let pickEndTime = 0;
        window.startPicking = function() {
            if(pickerItems.length === 0) return showToast("Chưa có danh sách!", "error");
            if(isPicking) return;
            
            isPicking = true;
            document.getElementById('btn-start-pick').innerHTML = `<i class="ph-bold ph-spinner-gap text-2xl animate-spin"></i> ĐANG GỌI...`;
            document.getElementById('btn-start-pick').classList.replace('bg-emerald-600', 'bg-slate-400');
            
            // Start sounds
            if (Tone.context.state !== 'running') Tone.start();
            let clickSynth = null;
            try { clickSynth = new Tone.Synth({ oscillator: { type: 'square' }, envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 } }).toDestination(); clickSynth.volume.value = -15; } catch(e) {}
            
            let soundInterval = setInterval(() => {
                if(clickSynth && Tone.context.state === 'running') clickSynth.triggerAttackRelease("G5", "32n", Tone.now());
            }, 150);

            pickEndTime = performance.now() + (pickerTime * 1000);

            setTimeout(() => {
                clearInterval(soundInterval);
                finishPick();
            }, pickerTime * 1000);
        }

        function finishPick() {
            isPicking = false;
            cancelAnimationFrame(pickerAnimationId);
            
            const btn = document.getElementById('btn-start-pick');
            if(btn){
                btn.innerHTML = `<i class="ph-fill ph-play text-2xl"></i> GỌI TIẾP`;

            }

            const isDark = pickerBg !== 'default';
            const modalContent = `
                <div class="flex flex-col items-center p-10 bg-white rounded-[2.5rem] shadow-2xl w-full max-w-md relative overflow-hidden group">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-yellow-50 rounded-bl-full -mr-10 -mt-10 z-0 opacity-50"></div>
                    
                    ${getAvatarImg(winner.data.avatarUrl, winner.data.name, 'relative z-10 w-40 h-40 shadow-xl mb-6 ring-8 ring-slate-50 group-hover:scale-105 transition-transform')}
                    
                    <div class="relative z-10 text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-2">${pickTarget === 'student' ? 'HỌC SINH ĐƯỢC CHỌN' : 'TỔ ĐƯỢC CHỌN'}</div>
                    <div class="relative z-10 text-3xl md:text-4xl font-black text-slate-800 text-center leading-tight mb-2">${winner.data.name}</div>
                    
                    ${winner.data.group ? `<div class="relative z-10 text-sm font-bold text-blue-600 uppercase bg-blue-50 px-4 py-1.5 rounded-xl border border-blue-100">${winner.data.group}</div>` : ''}

            showRandomResultModal('', modalContent); // Dùng lại modal kết quả đã có
            
            // Resume background animation slowly

        }
        
        // --- Helper: lấy ngày đầu tuần (Thứ 2) và cuối tuần (CN) từ 1 ngày bất kỳ ---
        window.getWeekRange = function(date) {
            const d = new Date(date);
            const day = d.getDay(); // 0=CN, 1=T2...
            const diffToMon = (day === 0 ? -6 : 1 - day);
            const mon = new Date(d); mon.setDate(d.getDate() + diffToMon); mon.setHours(0,0,0,0);
            const sun = new Date(mon); sun.setDate(mon.getDate() + 6); sun.setHours(23,59,59,999);
            return { start: mon, end: sun };
        };

        // --- Helper: lấy danh sách các tuần từ history tất cả học sinh ---
        window.getAvailableWeeks = function() {
            const weekSet = new Map();
            // Thêm tuần hiện tại luôn
            const thisWeek = getWeekRange(new Date());
            const thisKey = thisWeek.start.toISOString().split('T')[0];
            weekSet.set(thisKey, thisWeek);

            (state.students || []).forEach(s => {
                (s.history || []).forEach(h => {
                    if (!h.date) return;
                    const wr = getWeekRange(new Date(h.date));
                    const key = wr.start.toISOString().split('T')[0];
                    if (!weekSet.has(key)) weekSet.set(key, wr);
                });
            });
            // Sắp xếp mới nhất trước
            return [...weekSet.entries()].sort((a, b) => b[0].localeCompare(a[0])).map(([key, wr]) => ({
                key,
                start: wr.start,
                end: wr.end,
                label: `${String(wr.start.getDate()).padStart(2,'0')}/${String(wr.start.getMonth()+1).padStart(2,'0')} — ${String(wr.end.getDate()).padStart(2,'0')}/${String(wr.end.getMonth()+1).padStart(2,'0')}/${wr.end.getFullYear()}`
            }));
        };

        // --- Tính điểm thi đua tuần cho học sinh ---
        window.getWeekPoints = function(student, weekStart, weekEnd) {
            let pos = 0, neg = 0;
            (student.history || []).forEach(h => {
                if (!h.date) return;
                const hd = new Date(h.date);
                if (hd >= weekStart && hd <= weekEnd) {
                    if (h.points > 0) pos += h.points;
                    else neg += h.points;
                }
            });
            return { pos, neg, net: pos + neg };
        };

        // --- Helper: tính điểm trong khoảng bất kỳ (dùng chung) ---
        window.getRangePoints = function(student, start, end) {
            let pos = 0, neg = 0;
            (student.history || []).forEach(h => {
                if (!h.date) return;
                const hd = new Date(h.date);
                if (hd >= start && hd <= end) {
                    if (h.points > 0) pos += h.points;
                    else neg += h.points;
                }
            });
            return { pos, neg, net: pos + neg };
        };

        // --- Helper: lấy khoảng tháng hiện tại ---
        window.getCurrentMonthRange = function() {
            const now = new Date();
            const start = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0, 0);
            const end = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999);
            return { start, end, label: `Tháng ${now.getMonth() + 1}/${now.getFullYear()}` };
        };

        // --- Helper: lấy khoảng học kỳ hiện tại (HK1: 9-12, HK2: 1-5) ---
        window.getCurrentSemesterRange = function() {
            const now = new Date();
            const m = now.getMonth() + 1; // 1-12
            let start, end, label;
            if (m >= 9) {
                // Học kỳ 1: tháng 9 năm nay -> tháng 12 năm nay
                start = new Date(now.getFullYear(), 8, 1, 0, 0, 0, 0);
                end = new Date(now.getFullYear(), 11, 31, 23, 59, 59, 999);
                label = `Học kỳ 1 (${now.getFullYear()})`;
            } else if (m <= 5) {
                // Học kỳ 2: tháng 1 -> tháng 5 năm nay
                start = new Date(now.getFullYear(), 0, 1, 0, 0, 0, 0);
                end = new Date(now.getFullYear(), 4, 31, 23, 59, 59, 999);
                label = `Học kỳ 2 (${now.getFullYear()})`;
            } else {
                // Tháng hè (6-8): coi là cuối HK2
                start = new Date(now.getFullYear(), 0, 1, 0, 0, 0, 0);
                end = new Date(now.getFullYear(), 7, 31, 23, 59, 59, 999);
                label = `Học kỳ 2 (${now.getFullYear()})`;
            }
            return { start, end, label };
        };

        // --- Helper: lấy khoảng năm học hiện tại ---
        window.getCurrentYearRange = function() {
            const now = new Date();
            let startYear = now.getMonth() >= 8 ? now.getFullYear() : now.getFullYear() - 1;
            const start = new Date(startYear, 8, 1, 0, 0, 0, 0);
            const end = new Date(startYear + 1, 4, 31, 23, 59, 59, 999);
            return { start, end, label: `Năm học ${startYear}-${startYear + 1}` };
        };

        // --- Helper: lấy khoảng tuần hiện tại ---
        window.getCurrentWeekRange = function() {
            const wr = getWeekRange(new Date());
            const label = `Tuần ${String(wr.start.getDate()).padStart(2,'0')}/${String(wr.start.getMonth()+1).padStart(2,'0')} — ${String(wr.end.getDate()).padStart(2,'0')}/${String(wr.end.getMonth()+1).padStart(2,'0')}`;
            return { start: wr.start, end: wr.end, label };
        };
