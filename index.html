                            <p class="text-slate-500 text-sm font-medium mt-1">Tôn vinh những cá nhân xuất sắc và có nhiều tiến bộ</p>
                        </div>
                        <div class="flex flex-wrap bg-slate-100 p-1.5 rounded-2xl border border-slate-200 w-full md:w-auto gap-1">
                            <button onclick="switchRankingTab('bang-vang')" class="flex-1 md:flex-none px-4 py-2.5 rounded-xl text-sm font-bold transition-all ${rankingTab === 'bang-vang' ? 'bg-white text-blueAccent shadow-sm' : 'text-slate-500 hover:text-slate-800'}"><i class="ph-fill ph-crown mr-1"></i> Bảng Vàng</button>
                            <button onclick="switchRankingTab('tien-bo')" class="flex-1 md:flex-none px-4 py-2.5 rounded-xl text-sm font-bold transition-all ${rankingTab === 'tien-bo' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-500 hover:text-slate-800'}"><i class="ph-fill ph-trend-up mr-1"></i> Bảng Tiến Bộ</button>
                            <button onclick="switchRankingTab('xep-thi-dua-tuan')" class="flex-1 md:flex-none px-4 py-2.5 rounded-xl text-sm font-bold transition-all ${rankingTab === 'xep-thi-dua-tuan' ? 'bg-white text-amber-600 shadow-sm' : 'text-slate-500 hover:text-slate-800'}"><i class="ph-fill ph-calendar-week mr-1"></i> Xếp Thi Đua Tuần</button>
                        </div>
                    </div>
                    ${contentHtml}
                </div>
            `;
        }

        function switchRankingTab(tab) { rankingTab = tab; renderLayout(); }

        function switchReportTab(tab) { state.reportTab = tab; renderLayout(); }
        
        function saveStudentComment(id, value) { 
            const s = state.students.find(x => x.id === id); 
            if (s) { s.comment = value; saveData(); showToast("Đã lưu nhận xét tự động!"); } 
        }

        // ============================================================
        // ĐÁNH GIÁ NHẬN XÉT THEO THÁNG / HỌC KỲ
        // ============================================================

        // --- Helper: Lấy danh sách tháng có dữ liệu ---
        window.getAvailableMonths = function() {
            const monthsSet = new Map();
            const now = new Date();
            const thisKey = `${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`;
            const thisStart = new Date(now.getFullYear(), now.getMonth(), 1, 0,0,0,0);
            const thisEnd = new Date(now.getFullYear(), now.getMonth()+1, 0, 23,59,59,999);
            monthsSet.set(thisKey, {start: thisStart, end: thisEnd, label: `Tháng ${now.getMonth()+1}/${now.getFullYear()}`});
            (state.students || []).forEach(s => {
                (s.history || []).forEach(h => {
                    if (!h.date) return;
                    const hd = new Date(h.date);
                    const key = `${String(hd.getMonth()+1).padStart(2,'0')}/${hd.getFullYear()}`;
                    if (!monthsSet.has(key)) {
                        const mStart = new Date(hd.getFullYear(), hd.getMonth(), 1, 0,0,0,0);
                        const mEnd = new Date(hd.getFullYear(), hd.getMonth()+1, 0, 23,59,59,999);
                        monthsSet.set(key, {start: mStart, end: mEnd, label: `Tháng ${hd.getMonth()+1}/${hd.getFullYear()}`});
                    }
                });
            });
            return [...monthsSet.entries()].sort((a,b) => b[0].localeCompare(a[0])).map(([key, v]) => ({key, ...v}));
        };

        // --- Helper: Lấy danh sách học kỳ ---
        window.getAvailableSemesters = function() {
            const semesters = [];
            const now = new Date();
            const currentYear = now.getMonth() >= 8 ? now.getFullYear() : now.getFullYear() - 1;
            // HK1: T8-T12 của currentYear
            semesters.push({
                key: `HK1-${currentYear}`,
                label: `Học kỳ 1 (${currentYear}-${currentYear+1})`,
                start: new Date(currentYear, 7, 1, 0,0,0,0),
                end: new Date(currentYear, 11, 31, 23,59,59,999)
            });
            // HK2: T1-T5 của currentYear+1
            semesters.push({
                key: `HK2-${currentYear}`,
                label: `Học kỳ 2 (${currentYear}-${currentYear+1})`,
                start: new Date(currentYear+1, 0, 1, 0,0,0,0),
                end: new Date(currentYear+1, 4, 31, 23,59,59,999)
            });
            // Cả năm
            semesters.push({
                key: `CN-${currentYear}`,
                label: `Cả năm (${currentYear}-${currentYear+1})`,
                start: new Date(currentYear, 7, 1, 0,0,0,0),
                end: new Date(currentYear+1, 4, 31, 23,59,59,999)
            });
            return semesters;
        };

        // --- Tính xếp loại thi đua theo khoảng thời gian ---
        window.classifyStudentByRange = function(student, start, end) {
            let pos = 0, neg = 0, negAbs = 0;
            (student.history || []).forEach(h => {
                if (!h.date) return;
                const hd = new Date(h.date);
                if (hd >= start && hd <= end) {
                    if (h.points > 0) pos += h.points;
                    else { neg += h.points; negAbs += Math.abs(h.points); }
                }
            });
            const net = pos + neg;
            // Tính số tuần trong khoảng
            const totalDays = Math.max(1, Math.ceil((end - start) / (1000*60*60*24)));
            const totalWeeks = Math.max(1, Math.ceil(totalDays / 7));
            const avgPerWeek = net / totalWeeks;

            // Xếp loại (kết hợp tổng net + mức trừ)
            let xepLoai = 'Đạt'; let badgeColor = 'bg-yellow-50 text-yellow-700 border-yellow-200';
            let emoji = '🟡';
            if (avgPerWeek >= 15 && negAbs === 0) {
                xepLoai = 'Xuất sắc'; badgeColor = 'bg-emerald-50 text-emerald-700 border-emerald-200'; emoji = '🌟';
            } else if (avgPerWeek >= 10 && negAbs <= 5) {
                xepLoai = 'Tốt'; badgeColor = 'bg-blue-50 text-blue-700 border-blue-200'; emoji = '✅';
            } else if (avgPerWeek >= 5) {
                xepLoai = 'Khá'; badgeColor = 'bg-indigo-50 text-indigo-600 border-indigo-200'; emoji = '👍';
            } else if (net < 0 || negAbs >= 15) {
                xepLoai = 'Cần cố gắng'; badgeColor = 'bg-red-50 text-red-600 border-red-200'; emoji = '⚠️';
            }
            // Điều kiện cứng: bị trừ >= 20 trong khoảng → buộc "Cần cố gắng"
            if (negAbs >= 20) {
                xepLoai = 'Cần cố gắng'; badgeColor = 'bg-red-50 text-red-600 border-red-200'; emoji = '⚠️';
            }
            return { pos, neg, negAbs, net, xepLoai, badgeColor, emoji, avgPerWeek: Math.round(avgPerWeek*10)/10, totalWeeks };
        };

        // --- Tạo nhận xét tự động cho 1 học sinh ---
        window.generateStudentEvaluation = function(student, rangeData, periodLabel) {
            const name = student.name;
            const { pos, negAbs, net, xepLoai, avgPerWeek, totalWeeks } = rangeData;
            
            // Phân tích chi tiết từ lịch sử
            const posReasons = {}; const negReasons = {};
            (student.history || []).forEach(h => {
                if (!h.date || !h.reason) return;
                if (h.points > 0) posReasons[h.reason] = (posReasons[h.reason] || 0) + h.points;
                else if (h.points < 0) negReasons[h.reason] = (negReasons[h.reason] || 0) + Math.abs(h.points);
            });
            const topPos = Object.entries(posReasons).sort((a,b)=>b[1]-a[1]).slice(0,3);
            const topNeg = Object.entries(negReasons).sort((a,b)=>b[1]-a[1]).slice(0,2);

            let comment = '';
            if (xepLoai === 'Xuất sắc') {
                comment = `Em ${name} đạt kết quả thi đua XUẤT SẮC trong ${periodLabel} với tổng cộng +${pos} điểm (trung bình ${avgPerWeek} điểm/tuần qua ${totalWeeks} tuần). `;
                if (topPos.length > 0) comment += `Nổi bật: ${topPos.map(r => r[0]).join(', ')}. `;
                comment += `Em luôn gương mẫu, tích cực trong học tập và rèn luyện. Tuyên dương và biểu dương trước lớp!`;
            } else if (xepLoai === 'Tốt') {
                comment = `Em ${name} đạt kết quả TỐT trong ${periodLabel} với +${pos} điểm cộng${negAbs > 0 ? ', -'+negAbs+' điểm trừ' : ''} (net: ${net >= 0 ? '+' : ''}${net}). `;
                if (topPos.length > 0) comment += `Điểm mạnh: ${topPos.map(r => r[0]).join(', ')}. `;
                if (topNeg.length > 0) comment += `Cần khắc phục: ${topNeg.map(r => r[0]).join(', ')}. `;
                comment += `Em cần phát huy hơn nữa để đạt Xuất sắc!`;
            } else if (xepLoai === 'Khá') {
                comment = `Em ${name} đạt mức KHÁ trong ${periodLabel} (net: ${net >= 0 ? '+' : ''}${net}). `;
                if (topPos.length > 0) comment += `Ghi nhận: ${topPos.map(r => r[0]).join(', ')}. `;
                if (topNeg.length > 0) comment += `Hạn chế cần sửa: ${topNeg.map(r => r[0]).join(', ')}. `;
                comment += `Em cần nỗ lực hơn trong thời gian tới.`;
            } else if (xepLoai === 'Đạt') {
                comment = `Em ${name} đạt mức ĐẠT trong ${periodLabel} (cộng: +${pos}, trừ: -${negAbs}, net: ${net >= 0 ? '+' : ''}${net}). `;
                if (topNeg.length > 0) comment += `Cần khắc phục: ${topNeg.map(r => r[0]).join(', ')}. `;
                comment += `Em cần cố gắng hơn nữa, tích cực tham gia hoạt động để cải thiện kết quả thi đua.`;
            } else {
                comment = `Em ${name} xếp loại CẦN CỐ GẮNG trong ${periodLabel} (cộng: +${pos}, trừ: -${negAbs}, net: ${net >= 0 ? '+' : ''}${net}). `;
                if (topNeg.length > 0) comment += `Vi phạm chính: ${topNeg.map(r => r[0]).join(', ')}. `;
                comment += `GVCN nhắc nhở em nghiêm túc rèn luyện, cần sự phối hợp của gia đình để tiến bộ hơn.`;
            }
            return comment;
        };

        // --- Lưu nhận xét đánh giá ---
        window.saveEvalComment = function(studentId, periodKey, value) {
            if (!state.monthlyEvaluations) state.monthlyEvaluations = {};
            if (!state.semesterEvaluations) state.semesterEvaluations = {};
            // Phân biệt tháng vs học kỳ dựa trên key format
            if (periodKey.startsWith('HK') || periodKey.startsWith('CN')) {
                if (!state.semesterEvaluations[periodKey]) state.semesterEvaluations[periodKey] = {};
                state.semesterEvaluations[periodKey][studentId] = value;
            } else {
                if (!state.monthlyEvaluations[periodKey]) state.monthlyEvaluations[periodKey] = {};
                state.monthlyEvaluations[periodKey][studentId] = value;
            }
            saveData();
        };
        let evalCommentDebounce = null;
        window.saveEvalCommentDebounced = function(studentId, periodKey, value) {
            clearTimeout(evalCommentDebounce);
            evalCommentDebounce = setTimeout(() => { saveEvalComment(studentId, periodKey, value); }, 500);
        };

        // --- Lấy nhận xét đã lưu ---
        window.getEvalComment = function(studentId, periodKey) {
            if (periodKey.startsWith('HK') || periodKey.startsWith('CN')) {
                return (state.semesterEvaluations && state.semesterEvaluations[periodKey] && state.semesterEvaluations[periodKey][studentId]) || '';
            }
            return (state.monthlyEvaluations && state.monthlyEvaluations[periodKey] && state.monthlyEvaluations[periodKey][studentId]) || '';
        };

        // --- Tự động tạo nhận xét cho tất cả HS trong kỳ ---
        window.autoGenerateAllEvals = function(periodKey, start, end, periodLabel) {
            if (!confirm(`Tự động tạo nhận xét cho TẤT CẢ ${state.students.length} học sinh trong ${periodLabel}?\n\n⚠️ Nhận xét đã chỉnh sửa sẽ bị ghi đè!`)) return;
            state.students.forEach(s => {
                const rangeData = classifyStudentByRange(s, start, end);
                const comment = generateStudentEvaluation(s, rangeData, periodLabel);
                saveEvalComment(s.id, periodKey, comment);
            });
            saveData(); renderLayout();
            showToast(`✅ Đã tạo nhận xét tự động cho ${state.students.length} học sinh!`, 'success');
        };

        // --- Xuất đánh giá ra Excel ---
        window.exportEvalExcel = function(periodKey, start, end, periodLabel) {
            const rows = state.students.map((s, i) => {
                const rd = classifyStudentByRange(s, start, end);
                const comment = getEvalComment(s.id, periodKey) || generateStudentEvaluation(s, rd, periodLabel);
                return {
                    'STT': i + 1,
                    'Họ và tên': s.name,
                    'Tổ': s.group,
                    'Điểm cộng': rd.pos,
                    'Điểm trừ': rd.negAbs,
                    'Điểm net': rd.net,
                    'TB/tuần': rd.avgPerWeek,
                    'Xếp loại': rd.xepLoai,
                    'Nhận xét': comment
                };
            });
            const ws = XLSX.utils.json_to_sheet(rows);
            ws['!cols'] = [{wch:5},{wch:25},{wch:10},{wch:10},{wch:10},{wch:10},{wch:10},{wch:14},{wch:60}];
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Đánh giá');
            XLSX.writeFile(wb, `Danh_gia_${periodLabel.replace(/[^a-zA-Z0-9]/g,'_')}.xlsx`);
            showToast('📊 Đã xuất file Excel đánh giá thành công!', 'success');
        };

        // --- Sao chép tất cả nhận xét ---
        window.copyAllEvals = async function(periodKey, start, end, periodLabel) {
            let text = `📋 ĐÁNH GIÁ THI ĐUA ${periodLabel.toUpperCase()}\n`;
            text += `🏫 ${state.admin.className || 'Lớp học'} — GVCN: ${state.admin.name}\n`;
            text += `${'═'.repeat(50)}\n\n`;
            state.students.forEach((s, i) => {
                const rd = classifyStudentByRange(s, start, end);
                const comment = getEvalComment(s.id, periodKey) || generateStudentEvaluation(s, rd, periodLabel);
                text += `${i+1}. ${s.name} — ${rd.emoji} ${rd.xepLoai} (net: ${rd.net >= 0 ? '+' : ''}${rd.net})\n`;
                text += `   ${comment}\n\n`;
            });
            const success = await copyToClipboard(text);
            if (success) showToast('✅ Đã sao chép toàn bộ nhận xét đánh giá!', 'success');
            else showToast('❌ Lỗi sao chép, vui lòng thử lại!', 'error');
        };

        // --- Chuyển sub-tab đánh giá ---
        window.switchEvalSubTab = function(sub) { state.evalSubTab = sub; renderLayout(); };
        window.changeEvalMonth = function(key) { state.evalSelectedMonth = key; renderLayout(); };
        window.changeEvalSemester = function(key) { state.evalSelectedSemester = key; renderLayout(); };

        // --- RENDER TAB ĐÁNH GIÁ ---
        window.renderEvaluationTab = function(sortedStudents, now) {
            const evalSubTab = state.evalSubTab || 'thang';

            // Lấy danh sách tháng / học kỳ
            const months = getAvailableMonths();
            const semesters = getAvailableSemesters();

            // Chọn mặc định
            if (!state.evalSelectedMonth && months.length > 0) state.evalSelectedMonth = months[0].key;
            if (!state.evalSelectedSemester && semesters.length > 0) state.evalSelectedSemester = semesters[0].key;

            // Xác định period hiện tại
            let activePeriod = null;
            if (evalSubTab === 'thang') {
                activePeriod = months.find(m => m.key === state.evalSelectedMonth) || months[0];
            } else {
                activePeriod = semesters.find(s => s.key === state.evalSelectedSemester) || semesters[0];
            }
            if (!activePeriod) return '<div class="py-12 text-center text-slate-400 font-medium">Chưa có dữ liệu đánh giá.</div>';

            const periodKey = activePeriod.key;
            const periodLabel = activePeriod.label;
            const rangeStart = activePeriod.start;
            const rangeEnd = activePeriod.end;

            // Tính toán cho từng HS
            const evaluatedStudents = sortedStudents.map(s => {
                const rd = classifyStudentByRange(s, rangeStart, rangeEnd);
                const savedComment = getEvalComment(s.id, periodKey);
                return { ...s, ...rd, savedComment };
            }).sort((a,b) => b.net - a.net);

            // Thống kê
            const countXS = evaluatedStudents.filter(s => s.xepLoai === 'Xuất sắc').length;
            const countTot = evaluatedStudents.filter(s => s.xepLoai === 'Tốt').length;
            const countKha = evaluatedStudents.filter(s => s.xepLoai === 'Khá').length;
            const countDat = evaluatedStudents.filter(s => s.xepLoai === 'Đạt').length;
            const countCCG = evaluatedStudents.filter(s => s.xepLoai === 'Cần cố gắng').length;
            const totalNet = evaluatedStudents.reduce((s,x) => s + x.net, 0);
            const totalPos = evaluatedStudents.reduce((s,x) => s + x.pos, 0);
            const totalNeg = evaluatedStudents.reduce((s,x) => s + x.negAbs, 0);
            const countHasComment = evaluatedStudents.filter(s => s.savedComment).length;

            // Dropdown options
            const monthOptions = months.map(m => `<option value="${m.key}" ${m.key === state.evalSelectedMonth ? 'selected' : ''}>${m.label}</option>`).join('');
            const semesterOptions = semesters.map(s => `<option value="${s.key}" ${s.key === state.evalSelectedSemester ? 'selected' : ''}>${s.label}</option>`).join('');

            // --- Student cards ---
            const studentCardsHtml = evaluatedStudents.map((s, index) => {
                const autoComment = generateStudentEvaluation(s, s, periodLabel);
                const displayComment = s.savedComment || '';
                const medals = ['🥇','🥈','🥉'];
                const medal = index < 3 && s.net > 0 ? medals[index] : '';

                return `
                <div class="bg-white rounded-[1.8rem] shadow-sm border border-slate-100 hover:shadow-lg hover:border-violet-100 transition-all mb-4 overflow-hidden group break-inside-avoid" id="eval-card-${s.id}">
                    <!-- Header: Info + Stats -->
                    <div class="flex flex-col lg:flex-row gap-0">
                        <!-- LEFT: Student Info -->
                        <div class="lg:w-[320px] p-5 bg-gradient-to-br from-slate-50 to-white flex items-center gap-4 border-b lg:border-b-0 lg:border-r border-slate-100 flex-shrink-0">
                            <div class="relative flex-shrink-0">
                                <span class="absolute -top-1 -left-1 text-lg z-10">${medal}</span>
                                ${getAvatarImg(s.avatarUrl, s.name, 'w-14 h-14 rounded-2xl ring-4 ring-white shadow-md')}
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="text-xs text-slate-400 font-bold">#${index + 1}</div>
                                <div class="font-black text-slate-800 text-base truncate">${s.name}</div>
                                <div class="flex flex-wrap items-center gap-1.5 mt-1.5">
                                    <span class="text-[10px] font-bold bg-white border border-slate-200 text-slate-500 px-2 py-0.5 rounded-lg">${s.group || 'Tổ 1'}</span>
                                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-lg border ${s.badgeColor}">${s.emoji} ${s.xepLoai}</span>
                                </div>
                            </div>
                        </div>

                        <!-- MIDDLE: Points Stats -->
                        <div class="flex-shrink-0 flex items-center gap-3 p-4 px-5 bg-white border-b lg:border-b-0 lg:border-r border-slate-100">
                            <div class="text-center px-3">
                                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Cộng</div>
                                <div class="text-lg font-black text-emerald-600">+${s.pos}</div>
                            </div>
                            <div class="text-center px-3">
                                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Trừ</div>
                                <div class="text-lg font-black text-red-500">-${s.negAbs}</div>
                            </div>
                            <div class="text-center px-3 bg-slate-50 rounded-xl py-2">
                                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Net</div>
                                <div class="text-lg font-black ${s.net >= 0 ? 'text-emerald-600' : 'text-red-500'}">${s.net >= 0 ? '+' : ''}${s.net}</div>
                            </div>
                            <div class="text-center px-3">
                                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">TB/tuần</div>
                                <div class="text-lg font-black text-violet-600">${s.avgPerWeek}</div>
                            </div>
                        </div>

                        <!-- RIGHT: Comment textarea -->
                        <div class="flex-1 p-4 relative">
                            <div class="absolute left-7 top-7 text-violet-200/50 pointer-events-none">
                                <i class="ph-fill ph-quotes text-3xl"></i>
                            </div>
                            <textarea 
                                onchange="saveEvalComment(${s.id}, '${periodKey}', this.value)" 
                                oninput="saveEvalCommentDebounced(${s.id}, '${periodKey}', this.value)" 
                                class="w-full bg-white border-2 border-slate-100 rounded-2xl p-4 pl-14 outline-none focus:border-violet-400 focus:bg-violet-50/10 transition-all resize-y min-h-[90px] text-slate-700 text-sm font-medium placeholder:text-slate-400 placeholder:font-normal leading-relaxed" 
                                placeholder="Nhập nhận xét đánh giá cho ${escapeHtmlAttr(s.name)}...">${escapeHtmlAttr(displayComment)}</textarea>
                            <div class="flex items-center gap-2 mt-2">
                                <button onclick="document.querySelector('#eval-card-${s.id} textarea').value = generateStudentEvaluation(state.students.find(x=>x.id===${s.id}), classifyStudentByRange(state.students.find(x=>x.id===${s.id}), new Date('${rangeStart.toISOString()}'), new Date('${rangeEnd.toISOString()}')), '${escapeInlineJs(periodLabel)}'); saveEvalComment(${s.id}, '${periodKey}', document.querySelector('#eval-card-${s.id} textarea').value);" class="text-[11px] font-bold text-violet-600 bg-violet-50 hover:bg-violet-100 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1 border border-violet-100 cursor-pointer" title="Tạo nhận xét tự động dựa trên dữ liệu thi đua">
                                    <i class="ph-bold ph-magic-wand text-sm"></i> Tạo tự động
                                </button>
                                <button onclick="saveEvalComment(${s.id}, '${periodKey}', document.querySelector('#eval-card-${s.id} textarea').value); showToast('💾 Đã lưu nhận xét!');" class="text-[11px] font-bold text-slate-500 bg-slate-50 hover:bg-slate-100 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1 border border-slate-200 cursor-pointer">
                                    <i class="ph-bold ph-floppy-disk text-sm"></i> Lưu

window.copyParentMessage = async function(studentId) {
            const student = state.students.find(s => s.id === studentId);
            if (!student) return;
            
            const gvcn = state.admin.name || "GVCN";
            const className = state.admin.className || "Lớp";
            
            let msg = `Kính gửi Phụ huynh em ${student.name},\n`;
            msg += `${gvcn} xin thông báo tình hình rèn luyện của con tại lớp ${className} trong thời gian qua như sau:\n\n`;
            
            msg += `🏆 Tổng điểm thi đua hiện tại: ${student.points || 0} điểm\n`;
            if (student.gvcnGrade) {
                msg += `📝 Đánh giá của GVCN: Xếp loại ${student.gvcnGrade}\n\n`;
            } else {
                msg += `\n`;
            }
            
            msg += `📋 Chi tiết ghi nhận gần đây:\n`;
            if (student.history && student.history.length > 0) {
                const sortedHistory = [...student.history].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5);
                sortedHistory.forEach(h => {

                    const sign = h.points > 0 ? "+" : "";

                    msg += `- Ngày ${dStr}: ${h.reason} (${sign}${h.points} điểm)${actorInfo}\n`;
                });

                    msg += `- ...và ${student.history.length - 5} ghi nhận khác.\n`;
                }
            } else {
                msg += `- Chưa có ghi nhận nào.\n`;
            }
            
            if (student.comment) {
                msg += `\n💡 Lời nhắn riêng từ GVCN: ${student.comment}\n`;
            }
            
            const appUrl = getBaseLookupLink();
            msg += `\n🔗 Phụ huynh có thể xem chi tiết trực tiếp tại link: ${appUrl}\n(Mã tra cứu của con là: ${student.code})\n\n`;
            msg += `Trân trọng!`;
            
            const success = await copyToClipboard(msg);
            if(success) {
                showToast(`Đã copy báo cáo của ${student.name} để gửi Zalo!`, "success");
            } else {
                showToast("Lỗi copy, vui lòng thử lại.", "error");
            }
        };
        // --- BỔ SUNG: TIỆN ÍCH COPY CLIPBOARD TOÀN DIỆN ---
        window.copyToClipboard = async function(text) {
            if (!text) return false;
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (e) {
                console.warn("navigator.clipboard không khả dụng, chuyển sang fallback execCommand:", e);
            }
            try {
                const textarea = document.createElement("textarea");
                textarea.value = text;
                textarea.style.position = "fixed";
                textarea.style.top = "-9999px";
                textarea.style.left = "-9999px";
                textarea.setAttribute("readonly", "");
                document.body.appendChild(textarea);
                textarea.select();
                const successful = document.execCommand("copy");
                document.body.removeChild(textarea);
                return !!successful;
            } catch (err) {
                console.error("Lỗi fallback execCommand:", err);
                return false;
            }
        };

        // --- HÀM TỔNG HỢP & PHÂN TÍCH NHẬN XÉT THI ĐUA TUẦN CẢ LỚP GỬI PHỤ HUYNH ---
        window.generateWeeklyClassComment = function(weekKey, customStyle) {
            const weeks = typeof getAvailableWeeks === 'function' ? getAvailableWeeks() : [];
            const selWeek = weeks.find(w => w.key === weekKey) || (weeks.length > 0 ? weeks[0] : null);
            
            const className = (state.admin && state.admin.className) || "Lớp 11D";
            const teacherName = (state.admin && state.admin.name) || "Giáo viên chủ nhiệm";
            const style = customStyle || state.weeklyCommentStyle || 'standard';

            if (!selWeek) {
                return `📢 THÔNG BÁO TỔNG KẾT TUẦN - ${className}\n👩‍🏫 GVCN: ${teacherName}\n\nHiện tại chưa có dữ liệu thi đua tuần. Kính chúc Quý phụ huynh và các con cuối tuần nhiều niềm vui và sức khỏe!`;
            }

            const weekLabel = selWeek.label;
            const startObj = selWeek.start;
            const endObj = selWeek.end;

            // Tính điểm thi đua trong tuần cho tất cả học sinh
            const studentStats = (state.students || []).map(s => {
                const wp = typeof getWeekPoints === 'function' ? getWeekPoints(s, startObj, endObj) : { pos: 0, neg: 0, net: 0 };
                const weekEvents = (s.history || []).filter(h => {
                    if (!h.date) return false;
                    const hd = new Date(h.date);
                    return hd >= startObj && hd <= endObj;
                });
                return {
                    id: s.id,
                    name: s.name,
                    group: s.group || 'Chưa chia tổ',
                    pos: wp.pos,
                    neg: wp.neg,
                    net: wp.net,
                    events: weekEvents,
                    points: s.points || 0
                };
            });

            // Sắp xếp học sinh theo điểm Net tuần giảm dần
            const rankedStudents = [...studentStats].sort((a, b) => b.net - a.net);

            const totalStudents = studentStats.length;
            const totalPos = studentStats.reduce((sum, s) => sum + s.pos, 0);
            const totalNeg = studentStats.reduce((sum, s) => sum + s.neg, 0);
            const totalNet = totalPos + totalNeg;

            // Hàm helper tính xếp loại (hybrid: net + điều kiện cứng điểm trừ)
            const _getXL = (net, absNeg) => {
                let xl = 'Bình thường';
                if (net >= 20) xl = 'Xuất sắc';
                else if (net >= 10) xl = 'Tốt';
                else if (net > 0) xl = 'Khá';
                else if (net < 0) xl = 'Cần cố gắng';
                if (absNeg > 0 && xl === 'Xuất sắc') xl = 'Tốt';
                if (absNeg >= 10 && xl !== 'Cần cố gắng') xl = 'Cần cố gắng';
                return xl;
            };
            const xuatSacCount = studentStats.filter(s => _getXL(s.net, Math.abs(s.neg)) === 'Xuất sắc').length;
            const totCount = studentStats.filter(s => _getXL(s.net, Math.abs(s.neg)) === 'Tốt').length;
            const khaCount = studentStats.filter(s => _getXL(s.net, Math.abs(s.neg)) === 'Khá').length;
            const canCoGangCount = studentStats.filter(s => _getXL(s.net, Math.abs(s.neg)) === 'Cần cố gắng').length;

            // 1. Tuyên dương Top đầu tuần
            const topPositive = rankedStudents.filter(s => s.net > 0);
            let topListText = '';
            if (topPositive.length > 0) {
                const top1 = topPositive[0];
                const top2 = topPositive.length > 1 ? topPositive[1] : null;
                const top3 = topPositive.length > 2 ? topPositive[2] : null;
                
                topListText += `🥇 Hạng 1: ${top1.name} (${top1.group}) (+${top1.net} điểm thi đua)\n`;
                if (top2) topListText += `🥈 Hạng 2: ${top2.name} (${top2.group}) (+${top2.net} điểm thi đua)\n`;
                if (top3) topListText += `🥉 Hạng 3: ${top3.name} (${top3.group}) (+${top3.net} điểm thi đua)\n`;

                const otherTops = topPositive.slice(3, 8).map(s => `${s.name} (+${s.net})`).join(', ');
                if (otherTops) {
                    topListText += `👏 Tuyên dương các bạn có điểm thi đua cao tiếp theo: ${otherTops}\n`;
                }
            } else {
                topListText = `• Cả lớp duy trì phong trào học tập nề nếp ổn định.\n`;
            }

            // 2. Điểm thi đua theo tổ
            const groupMap = {};
            (state.groups || []).forEach(g => { groupMap[g.name] = { name: g.name, pos: 0, neg: 0, net: 0, count: 0 }; });
            studentStats.forEach(s => {
                if (!groupMap[s.group]) groupMap[s.group] = { name: s.group, pos: 0, neg: 0, net: 0, count: 0 };
                groupMap[s.group].pos += s.pos;
                groupMap[s.group].neg += s.neg;
                groupMap[s.group].net += s.net;
                groupMap[s.group].count++;
            });
            const sortedGroups = Object.values(groupMap).sort((a, b) => b.net - a.net);
            let bestGroupText = '';
            if (sortedGroups.length > 0 && sortedGroups[0].net > 0) {
                bestGroupText = `🏆 Tổ thi đua xuất sắc nhất tuần: ${sortedGroups[0].name} (Tổng Net: ${sortedGroups[0].net > 0 ? '+' : ''}${sortedGroups[0].net} điểm)`;
            }

            // 3. Phân tích ưu điểm nổi bật & vi phạm
            const posReasonCounts = {};
            const negReasonCounts = {};
            studentStats.forEach(s => {
                s.events.forEach(h => {
                    const r = (h.reason || '').trim();
                    if (!r) return;
                    if (h.points > 0) {
                        posReasonCounts[r] = (posReasonCounts[r] || 0) + 1;
                    } else if (h.points < 0) {
                        negReasonCounts[r] = (negReasonCounts[r] || 0) + 1;
                    }
                });
            });

            const topPosReasons = Object.entries(posReasonCounts).sort((a, b) => b[1] - a[1]).slice(0, 4);
            const topNegReasons = Object.entries(negReasonCounts).sort((a, b) => b[1] - a[1]).slice(0, 4);

            let posHighlights = '';
            if (topPosReasons.length > 0) {
                posHighlights = topPosReasons.map(([reason, count]) => `  • ${reason} (${count} lượt ghi nhận)`).join('\n');
            } else {
                posHighlights = `  • Các con duy trì tốt nề nếp chung, trang phục gọn gàng đúng tác phong học sinh.`;
            }

            let negReminders = '';
            if (topNegReasons.length > 0) {
                negReminders = topNegReasons.map(([reason, count]) => `  • Tồn tại cần khắc phục: ${reason} (${count} trường hợp)`).join('\n');
            } else {
                negReminders = `  • Rất biểu dương cả lớp: Tuần qua không có trường hợp nào vi phạm kỷ luật hay bị trừ điểm!`;

            // 4. Thống kê chuyên cần nếu có
            let attendanceSummary = '';
            let weekDates = [];
            const tempD = new Date(startObj);
            while (tempD <= endObj) {
                const dStr = `${tempD.getFullYear()}-${String(tempD.getMonth()+1).padStart(2,'0')}-${String(tempD.getDate()).padStart(2,'0')}`;
                weekDates.push(dStr);
                tempD.setDate(tempD.getDate() + 1);
            }
            let totalPresent = 0, totalLate = 0, totalAbsent = 0;
            let hasAttendanceData = false;
            if (state.attendanceRecords) {
                weekDates.forEach(dStr => {
                    const dayRec = state.attendanceRecords[dStr];
                    if (dayRec && Object.keys(dayRec).length > 0) {
                        hasAttendanceData = true;
                        Object.values(dayRec).forEach(st => {
                            if (st === 'present') totalPresent++;
                            else if (st === 'late') totalLate++;
                            else if (st === 'excused' || st === 'unexcused') totalAbsent++;
                        });
                    }
                });
            }
            if (hasAttendanceData) {
                attendanceSummary = `\n📋 TÌNH HÌNH CHUYÊN CẦN TRONG TUẦN:\n- Đi học đúng giờ: ${totalPresent} lượt\n${totalLate > 0 ? `- Đi muộn: ${totalLate} lượt\n` : ''}${totalAbsent > 0 ? `- Nghỉ học: ${totalAbsent} lượt\n` : '- Tỷ lệ chuyên cần đạt 100% không vắng học sinh nào.\n'}`;
            }

            // Mẫu 1: Phong cách ngắn gọn (Zalo Quick)
            if (style === 'short') {
                return `📢 [${className}] TỔNG KẾT THI ĐUA & NỀ NẾP TUẦN (${weekLabel})
👩‍🏫 GVCN: ${teacherName}
---------------------------------
Kính gửi Quý Phụ huynh, GVCN xin gửi tới Quý PH tóm tắt tình hình rèn luyện của lớp trong tuần vừa qua:

📊 Kết quả chung:
• Điểm Net cả lớp: ${totalNet >= 0 ? '+' : ''}${totalNet} điểm (Cộng: +${totalPos} | Trừ: ${totalNeg})
• Tỷ lệ Xuất sắc & Tốt: ${xuatSacCount + totCount}/${totalStudents} học sinh
${bestGroupText ? `• ${bestGroupText}\n` : ''}
🌟 Khen ngợi Top dẫn đầu tuần:
${topListText}
✨ Ưu điểm nổi bật:
${posHighlights}

${topNegReasons.length > 0 ? `⚠️ Lưu ý nhắc nhở:\n${negReminders}\n` : ''}
💐 Kính mong Quý PH tiếp tục đồng hành cùng nhà trường đôn đốc các con. Chúc Quý phụ huynh và các con cuối tuần vui vẻ, bình an!`;

            // Mẫu 2: Phong cách thân mật, truyền cảm hứng
            if (style === 'warm') {
                return `🌸 THÔNG ĐIỆP YÊU THƯƠNG & TỔNG KẾT TUẦN - ${className} 🌸
🗓️ Thời gian: ${weekLabel}

🌈 1. BỨC TRANH THI ĐUA TOÀN LỚP:
- Điểm thi đua Net toàn lớp: ${totalNet >= 0 ? '+' : ''}${totalNet} điểm (Điểm cộng: +${totalPos} | Điểm trừ: ${totalNeg})
- Đã có ${xuatSacCount} bạn đạt danh hiệu Xuất sắc và ${totCount} bạn đạt loại Tốt!
${bestGroupText ? `- ${bestGroupText} 👏\n` : ''}${attendanceSummary}

window.saveStudentEdit = function() {
    // 1. Lấy dữ liệu từ các ô nhập liệu
    const nameInput = document.getElementById('edit-s-name').value.trim();
    if (!nameInput) {
        return showToast("Vui lòng nhập họ và tên học sinh!", "error");
    }
    
    // 2. Thu thập toàn bộ thông tin trên form (Bao gồm 4 trường mới)
    const studentData = {
        name: nameInput,
        avatarUrl: document.getElementById('edit-s-avatar').value.trim(),
        gender: document.getElementById('edit-s-gender').value,
        group: document.getElementById('edit-s-group').value,
        dob: document.getElementById('edit-s-dob').value,
        boardingType: document.getElementById('edit-s-boarding').value,
        code: document.getElementById('edit-s-code').value,
        role: document.getElementById('edit-s-role').value.trim(),
        goal: document.getElementById('edit-s-goal').value.trim(),
        talent: document.getElementById('edit-s-talent').value.trim(),
        ethnicity: document.getElementById('edit-s-ethnicity').value.trim() || 'Kinh',
        isUnionMember: document.getElementById('edit-s-union').value,
        prevAcademic: document.getElementById('edit-s-prev-academic').value,
        prevConduct: document.getElementById('edit-s-prev-conduct').value
    };
    
    // Bảo đảm mỗi học sinh có mã riêng, không trùng với bạn khác
    const dupCode = !studentData.code || state.students.some(x => String(x.code) === String(studentData.code) && x.id !== state.editingStudentId);
    if (dupCode) studentData.code = generateUniqueCode();

   // 3. Xử lý Lưu (Cập nhật người cũ hoặc Thêm người mới)
    if (state.editingStudentId) {
        const index = state.students.findIndex(s => s.id === state.editingStudentId);
        if (index > -1) {
            state.students[index] = { ...state.students[index], ...studentData };
            if(typeof logBCSAction === 'function') logBCSAction('Sửa thông tin học sinh: ' + studentData.name); 
            showToast("Đã cập nhật hồ sơ học sinh thành công!", "success");
        }
    } else {
        const newId = state.students.length > 0 ? Math.max(...state.students.map(s => s.id)) + 1 : 1;
        state.students.push({
            ...studentData,
            id: newId,
            points: 0,
            stars: 0,
            history: [],
            comment: ''
        });
        if(typeof logBCSAction === 'function') logBCSAction('Thêm học sinh mới: ' + studentData.name); 
        showToast("Đã thêm học sinh mới thành công!", "success");
    }
    
    // 4. Lưu dữ liệu, cập nhật giao diện và đóng form
    saveData();
    renderLayout();
    closeModal('edit-student-modal');
};
window.deleteStudent = function(id) {
    const studentIndex = state.students.findIndex(s => s.id === id);
    if (studentIndex === -1) return;
    
    const studentName = state.students[studentIndex].name;
    if (confirm(`Bạn có chắc chắn muốn xóa học sinh "${studentName}" khỏi danh sách không? Hành động này sẽ xóa luôn cả lịch sử thi đua của em ấy và không thể hoàn tác!`)) {
        
        state.students.splice(studentIndex, 1);
        
        if (state.attendanceRecords) {
            for (const date in state.attendanceRecords) {
                if (state.attendanceRecords[date][id]) {
                    delete state.attendanceRecords[date][id];
                }
            }
        }
        
        saveData();
        renderLayout();
        showToast(`Đã xóa triệt để ${studentName} khỏi hệ thống!`, "success");
    }
};

        function handleExcelUpload(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    const workbook = XLSX.read(evt.target.result, {type: 'binary'});
                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {header: 1});
                    processImportRows(rows);
                } catch(err) { showToast("Lỗi định dạng file Excel.", "error"); }
            };
            reader.readAsBinaryString(file);
        }

        function processPastedData() {
            const text = document.getElementById('import-paste-area').value.trim();
            if (!text) return showToast("Vui lòng dán dữ liệu!", "error");
            processImportRows(text.split('\n').map(row => row.split('\t')));
        }

      function processImportRows(rows) {
            let addedCount = 0;
            let currentId = state.students.length > 0 ? Math.max(...state.students.map(s => s.id)) + 1 : 1;
            rows.forEach((row, i) => {
                if (i === 0 && row[0] && row[0].toString().toLowerCase().includes('tên')) return;
                const name = (row[0] || '').toString().trim(); if (!name) return;
                state.students.push({ 
                    id: currentId++, name: name, 
                    gender: (row[1] || '').toString().trim() || 'Nam', 
                    group: (row[2] || '').toString().trim() || 'Tổ 1', 
                    role: (row[3] || '').toString().trim() || '', 
                    goal: (row[4] || '').toString().trim() || '', 
                    talent: (row[5] || '').toString().trim() || '', 
                    dob: (row[6] || '').toString().trim() || '',
                    boardingType: (row[7] || '').toString().trim() || 'Ngoại trú',
                    ethnicity: (row[8] || '').toString().trim() || 'Kinh',
                    isUnionMember: (row[9] || '').toString().trim() || 'Chưa',
                    prevAcademic: (row[10] || '').toString().trim() || '',
                    prevConduct: (row[11] || '').toString().trim() || '',
                    avatarUrl: '', points: 0, stars: 0, code: generateUniqueCode(), history: [] 
                });
                addedCount++;
            });
            if (addedCount > 0) { saveData(); renderLayout(); closeModal('import-modal'); showToast(`Đã nhập thành công ${addedCount} học sinh!`, "success"); }
        }

        function showRandomResultModal(title, htmlContent) {
            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-slate-900/80 z-[100] flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in" id="random-result-modal">
                    <div class="absolute inset-0 w-full h-full pointer-events-none z-0 overflow-hidden"><canvas id="modal-confetti-canvas" class="w-full h-full"></canvas></div>
                    <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-4xl overflow-hidden flex flex-col relative text-center pt-10 pb-12 px-6 z-10 animate-[popIn_0.5s_cubic-bezier(0.16,1,0.3,1)_forwards]">
                        <button onclick="closeModal('random-result-modal')" class="absolute top-6 right-6 text-slate-400 hover:bg-slate-200 rounded-full p-2 transition-colors z-20"><i class="ph-bold ph-x text-xl"></i></button>
                        <div class="inline-block px-4 py-1.5 rounded-full bg-accent/10 border border-accent/20 text-accent font-black text-xs uppercase tracking-widest mx-auto mb-4">Kết quả lựa chọn</div>
                        <h3 class="font-black text-3xl md:text-4xl text-slate-800 mb-10 uppercase tracking-tight flex items-center justify-center gap-3">${title}</h3>
                        <div class="flex flex-wrap justify-center gap-8 px-4 max-h-[60vh] overflow-y-auto custom-scrollbar">${htmlContent}</div>
                    </div>
                </div>
            `;
            setTimeout(() => {
                const canvas = document.getElementById('modal-confetti-canvas'); if (!canvas) return;
                canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
                const ctx = canvas.getContext('2d');
                const particles = [], colors = ['#3b82f6', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6'];
                for (let i = 0; i < 150; i++) particles.push({ x: canvas.width/2, y: canvas.height/2+50, r: Math.random()*6+3, dx: Math.random()*16-8, dy: Math.random()*-15-8, color: colors[Math.floor(Math.random()*colors.length)], tilt: Math.floor(Math.random()*10)-10, tiltAngleInc: (Math.random()*0.07)+0.05, tiltAngle: 0 });
                function render() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height); let active = 0;
                    particles.forEach(p => {
                        if (p.y < canvas.height) active++;
                        p.tiltAngle += p.tiltAngleInc; p.y += (Math.cos(p.tiltAngle) + p.dy + p.r/2)/2; p.x += Math.sin(p.tiltAngle)*2 + p.dx; p.dy += 0.25;
                        ctx.beginPath(); ctx.lineWidth = p.r; ctx.strokeStyle = p.color; ctx.moveTo(p.x+p.tilt+p.r, p.y); ctx.lineTo(p.x+p.tilt, p.y+p.tilt+p.r); ctx.stroke();
                    });
                    if (active > 0) requestAnimationFrame(render); else ctx.clearRect(0, 0, canvas.width, canvas.height);
                } render();
            }, 100);
        }

            const student = state.students.find(s => s.id === studentId); if (!student) return;

            let progressPercent = Math.min(100, (currentPoints / maxPoints) * 100);

            if (state.attendanceRecords) {

window.exportToPDF = function() {
            const element = document.getElementById('report-container');
            if (!element) return showToast("Không tìm thấy nội dung báo cáo!", "error");
            
            // Đổi trạng thái nút bấm để báo hiệu đang xử lý
            const btn = document.getElementById('btn-export-pdf');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class="ph-bold ph-spinner-gap animate-spin text-lg"></i> Đang tạo PDF...`;
            btn.disabled = true;
            btn.classList.add('opacity-70');

            // Cấu hình file PDF xuất ra (Nằm ngang, khổ A4, chất lượng nét)
            const opt = {
                margin:       10,
                filename:     `BaoCao_${state.admin.className || 'Lop'}_${getTodayString()}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, scrollY: 0 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
            };

            // Thực hiện xuất file
            const __wasDark = document.documentElement.classList.contains('dark');
            document.documentElement.classList.remove('dark');
            html2pdf().set(opt).from(element).save().then(() => {
                if (__wasDark) document.documentElement.classList.add('dark');
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-70');
                showToast("Đã tải xuống file PDF thành công!", "success");
            }).catch(err => {
                if (__wasDark) document.documentElement.classList.add('dark');
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-70');
                showToast("Lỗi khi tạo PDF, vui lòng thử lại!", "error");
                console.error(err);
            });
        };

// Hàm xử lý khi gõ số vào ô Phút/Giây
window.handleTimerInput = function() {
    if(isTimerRunning) return; // Không cho sửa khi đang chạy
    let inpM = parseInt(document.getElementById('timer-inp-m').value) || 0;
    let inpS = parseInt(document.getElementById('timer-inp-s').value) || 0;
    
    // Quy đổi nếu giây > 60
    if (inpS >= 60) {
        inpM += Math.floor(inpS / 60);
        inpS = inpS % 60;
        document.getElementById('timer-inp-m').value = inpM;
        document.getElementById('timer-inp-s').value = inpS;
    }
    
    timerSeconds = (inpM * 60) + inpS;
    document.getElementById('timer-main-display').innerText = `${String(inpM).padStart(2, '0')}:${String(inpS).padStart(2, '0')}`;
};

// Cập nhật giao diện đồng hồ khi đang chạy
window.updateTimerView = function() {
    const m = Math.floor(timerSeconds / 60);
    const s = timerSeconds % 60;
    
    const display = document.getElementById('timer-main-display');
    const inpM = document.getElementById('timer-inp-m');
    const inpS = document.getElementById('timer-inp-s');
    
    if(display) display.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    
    // Nếu đang chạy thì cập nhật luôn cả số ở ô nhập
    if (isTimerRunning) {
        if(inpM) inpM.value = m;
        if(inpS) inpS.value = s;
    }
};

// Khai báo bộ tạo âm thanh tíc tắc
let tickSynth = null;

window.toggleTimer = function() {
    const btn = document.getElementById('btn-timer-start');
    if (isTimerRunning) {
        clearInterval(timerInterval);
        isTimerRunning = false;
        if(btn) btn.innerText = 'Bắt Đầu';
    } else {
        if (timerSeconds <= 0) return showToast("Vui lòng nhập thời gian!", "error");
        
        // Khởi động âm thanh nếu chưa bật
        if (typeof Tone !== 'undefined') {
            if (Tone.context.state !== 'running') Tone.start();
            // Cài đặt âm thanh "tíc tắc" nếu chưa có
            if (!tickSynth) {
                tickSynth = new Tone.Synth({
                    oscillator: { type: "triangle" }, // Dùng sóng tam giác nghe cho êm, không bị chói
                    envelope: { attack: 0.01, decay: 0.05, sustain: 0, release: 0.01 }
                }).toDestination();
                tickSynth.volume.value = -12; // Âm lượng nhỏ gọn, vừa phải
            }
        }
        
        isTimerRunning = true;
        if(btn) btn.innerText = 'Tạm Dừng';
        
        timerInterval = setInterval(() => {
            timerSeconds--;
            if(timerSeconds < 0) timerSeconds = 0;
            updateTimerView();
            
            // Phát âm "tíc tắc" mỗi giây
            if (timerSeconds > 0 && tickSynth) {
                // Nhịp chẵn kêu tíc (nốt cao), nhịp lẻ kêu tắc (nốt trầm)
                const pitch = (timerSeconds % 2 === 0) ? "E5" : "C5";
                tickSynth.triggerAttackRelease(pitch, "32n");
            }
            
            if (timerSeconds <= 0) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                if(btn) btn.innerText = 'Bắt Đầu';
                showToast("Đã hết thời gian!", "success");
                
                if (typeof triggerConfetti === 'function') triggerConfetti();
                playBellSound(currentBellIndex); // Phát âm thanh chuông lúc hết giờ
            }
        }, 1000);
    }
};
window.endTimer = function() {
    clearInterval(timerInterval);
    isTimerRunning = false;
    timerSeconds = 0;
    updateTimerView();
    
    const inpM = document.getElementById('timer-inp-m');
    const inpS = document.getElementById('timer-inp-s');
    if(inpM) inpM.value = '0';
    if(inpS) inpS.value = '0';
    
    const btn = document.getElementById('btn-timer-start');
    if(btn) btn.innerText = 'Bắt Đầu';
};

// Xử lý chọn màu chuông
window.selectBell = function(idx) {
    currentBellIndex = idx;
    document.querySelectorAll('.bell-btn').forEach((el, i) => {
        if(i === idx) el.classList.add('ring-2', 'ring-offset-2', 'ring-slate-400', 'scale-110');
        else el.classList.remove('ring-2', 'ring-offset-2', 'ring-slate-400', 'scale-110');
    });
    // Phát thử âm thanh
    if (typeof Tone !== 'undefined' && Tone.context.state !== 'running') Tone.start();
    playBellSound(idx);
};

// Hàm phát âm thanh với các nốt nhạc khác nhau tùy theo chuông
window.playBellSound = function(idx = 0) {
    try {
        const synth = new Tone.PolySynth().toDestination();
        synth.volume.value = -5;
        // Các dải âm thanh khác nhau cho 6 loại chuông
        const notesList = [
            ['C5', 'E5', 'G5', 'C6'], // Vàng (Mặc định)
            ['D5', 'F#5', 'A5', 'D6'], // Xanh dương
            ['E5', 'G#5', 'B5', 'E6'], // Đỏ
            ['F5', 'A5', 'C6', 'F6'], // Xanh lá
            ['G5', 'B5', 'D6', 'G6'], // Tím
            ['A5', 'C#6', 'E6', 'A6']  // Cam
        ];
        const notes = notesList[idx % notesList.length];
        synth.triggerAttackRelease(notes, "1n");
    } catch(e) {}
};

            };

      // Hàm phân tích Excel tự động nhận diện Thứ và Tiết bóc dữ liệu ra state
       // Hàm phân tích Excel tự động (Thông minh - Không cần form mẫu cứng)
// Hàm phân tích Excel tự động (Thông minh - Cân mọi định dạng)
window.parseExcelToDailySchedule = function(rows) {
    const schedule = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] }; // Từ Thứ 2 (1) đến Thứ 7 (6)
    let headerRowIdx = -1;
    let dayCols = {}; 
    let timeColIdx = -1;
    let periodColIdx = -1;

    // Hàm hỗ trợ bỏ dấu tiếng Việt và khoảng trắng để so sánh dễ hơn
    const normalizeText = (text) => {
        if (!text) return '';
        return String(text).toLowerCase()
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .replace(/đ/g, "d").replace(/\s+/g, "");
    };

    // 1. Quét 15 dòng đầu để tìm dòng Tiêu đề (chứa các "Thứ")
    let maxDaysFound = 0;
    for (let i = 0; i < Math.min(rows.length, 15); i++) {
        const row = rows[i];
        if (!row) continue;
        
        let foundDays = 0;
        let tempDayCols = {};
        let tempTimeCol = -1, tempPeriodCol = -1;

        for (let c = 0; c < row.length; c++) {
            const cell = normalizeText(row[c]);
            // Bắt mọi thể loại ghi chữ Thứ
            if (cell.includes('thu2') || cell === 'hai' || cell === 't2') { tempDayCols[1] = c; foundDays++; }
            else if (cell.includes('thu3') || cell === 'ba' || cell === 't3') { tempDayCols[2] = c; foundDays++; }
            else if (cell.includes('thu4') || cell === 'tu' || cell === 't4') { tempDayCols[3] = c; foundDays++; }
            else if (cell.includes('thu5') || cell === 'nam' || cell === 't5') { tempDayCols[4] = c; foundDays++; }
            else if (cell.includes('thu6') || cell === 'sau' || cell === 't6') { tempDayCols[5] = c; foundDays++; }
            else if (cell.includes('thu7') || cell.includes('thubay') || cell === 'bay' || cell === 't7') { tempDayCols[6] = c; foundDays++; }
            else if (cell.includes('thoigian') || cell.includes('time') || cell.includes('gio')) { tempTimeCol = c; }
            else if (cell.includes('tiet') || cell.includes('ca') || cell.includes('stt')) { tempPeriodCol = c; }
        }

        // Nếu tìm thấy ít nhất 2 ngày trong tuần, chắc chắn đây là dòng Header
        if (foundDays > maxDaysFound && foundDays >= 2) {
            maxDaysFound = foundDays;
            headerRowIdx = i;
            dayCols = tempDayCols;
            timeColIdx = tempTimeCol;
            periodColIdx = tempPeriodCol;
        }
    }

    if (headerRowIdx === -1) {
        console.warn("Không tìm thấy hàng tiêu đề chứa các 'Thứ' trong file Excel.");
        return; 
    }

    // Nếu bảng không có cột Tiết, tự động lấy cột ngay trước cột Thứ 2 (nếu có), hoặc lấy cột 0
    if (periodColIdx === -1) {
        periodColIdx = (dayCols[1] > 0) ? dayCols[1] - 1 : 0;
    }

    let periodCounter = 1;

    // 2. Duyệt các dòng bên dưới dòng tiêu đề để bóc tách dữ liệu
    for (let i = headerRowIdx + 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row || row.length === 0) continue;

        // Xử lý cột Tiết (Lấy giá trị hoặc tự động đánh số nếu trống)
        let periodStr = '';
        const pCellRaw = row[periodColIdx];
        const pCellNorm = normalizeText(pCellRaw);
        
        // Reset biến đếm nếu gặp dòng "Buổi chiều"
        if (pCellNorm.includes('chieu')) periodCounter = 1;

        if (pCellRaw && String(pCellRaw).trim() !== '') {
            let val = String(pCellRaw).trim();
            if (!isNaN(val)) periodStr = `Tiết ${val}`; // Nếu chỉ ghi số 1, 2, 3
            else periodStr = val; // Giữ nguyên "Chào cờ", "SHL"
        } else {
            periodStr = `Tiết ${periodCounter}`;
        }

        // Xử lý cột Thời gian
        let timeStr = '--:--';
        if (timeColIdx !== -1 && row[timeColIdx]) {
            timeStr = String(row[timeColIdx]).trim().replace(/h/gi, ':');
        }

        let hasSubjectInRow = false;

        // 3. Trích xuất môn học cho từng Thứ
        for (let dayIndex = 1; dayIndex <= 6; dayIndex++) {
            const colIndex = dayCols[dayIndex];
            if (colIndex === undefined) continue;
            
            const subjectRaw = row[colIndex];
            if (subjectRaw && typeof subjectRaw === 'string' && subjectRaw.trim() !== '') {
                hasSubjectInRow = true;
                let mon = subjectRaw.trim();
                let gv = 'GV Bộ Môn';
                
                // Thuật toán tách Môn và Giáo viên thông minh
                if (mon.includes('\n')) {
                    const parts = mon.split('\n');
                    mon = parts[0].trim();
                    gv = parts.slice(1).join(' ').replace(/[-]/g, '').trim();
                } else if (mon.includes('-')) {
                    const parts = mon.split('-');
                    mon = parts[0].trim();
                    gv = parts.slice(1).join('-').trim();
                } else if (mon.includes('(')) {
                    const parts = mon.split('(');
                    mon = parts[0].trim();
                    gv = parts[1].replace(')', '').trim();
                }

                // Chỉ lấy nếu tên môn hợp lệ (bỏ qua rác)
                if (mon.length > 1) {
                    schedule[dayIndex].push({
                        period: periodStr.length > 15 ? `Tiết ${periodCounter}` : periodStr, // Rút gọn nếu chữ quá dài
                        time: timeStr,
                        subject: mon,
                        teacher: gv || 'GV Bộ Môn'
                    });
                }
            }
        }
        
        // Nếu dòng này có môn học thì mới tăng bộ đếm tiết
        if (hasSubjectInRow) periodCounter++;
    }
    
    state.dailySchedule = schedule;
};    // ---------------------------------------------------------

        window.executeQuickPoint = function(studentId, points, reason, category, type) {
            const student = state.students.find(s => s.id === studentId);
            if (!student) return;
            
            const pointsToApply = type === 'add' ? points : -points;
            
            // BỎ Math.max ĐỂ CHO PHÉP TỔNG ĐIỂM ÂM
            student.points = (student.points || 0) + pointsToApply; 
            
            // Điểm Sao dùng để đổi quà nên em vẫn giữ tối thiểu là 0 (để không bị nợ Sao trong cửa hàng)
            student.stars = Math.max(0, (student.stars || 0) + pointsToApply);
            
            if (!student.history) student.history = [];
            student.history.push({
                id: Date.now(),
                date: new Date().toISOString(),
                points: pointsToApply,
                reason: reason + ` [${category}]`
            });
            
            saveData();
            renderLayout(); // Load lại giao diện sau khi chấm xong
            
            showToast(`Đã ${type === 'add' ? 'cộng' : 'trừ'} ${points} điểm cho ${student.name}`, type === 'add' ? 'success' : 'error');
            if (type === 'add' && typeof triggerConfetti === 'function') triggerConfetti();

       // CÁC HÀM XỬ LÝ THÊM DÃY / GHẾ MỚI
        window.addColumn = function(direction) {
            if (!state.gridCols) state.gridCols = 6; // Mặc định 6 cột ban đầu
            let oldCols = state.gridCols;
            let oldRows = Math.ceil((state.totalSeats || 46) / oldCols);
            let newCols = oldCols + 1;            
            let newSeatingChart = {};
            let newHiddenSeats = [];
            
            for (let r = 0; r < oldRows; r++) {
                for (let c = 0; c < oldCols; c++) {
                    let oldIndex = r * oldCols + c + 1;
                    // Nếu thêm trái: Cột cũ dịch sang phải 1 đơn vị (+1). Nếu thêm phải: giữ nguyên cột cũ.
                    let newIndex = direction === 'left' ? (r * newCols + c + 2) : (r * newCols + c + 1);
                    
                    let oldId = 'seat-' + oldIndex;
                    let newId = 'seat-' + newIndex;
                    
                    if (state.seatingChart[oldId]) {
                        newSeatingChart[newId] = state.seatingChart[oldId];
                    }
                    if (state.hiddenSeats && state.hiddenSeats.includes(oldId)) {
                        newHiddenSeats.push(newId);
                    }
                }
            }
            
            state.gridCols = newCols;
            state.totalSeats = oldRows * newCols;
            state.seatingChart = newSeatingChart;
            state.hiddenSeats = newHiddenSeats;
            
            saveData();
            renderLayout();
            showToast(`Đã thêm 1 dãy ghế vào bên ${direction === 'left' ? 'trái' : 'phải'}!`, "success");

            const unassignedHtml = unassignedStudents.length > 0 
                ? unassignedStudents.map(s => `
                    <div class="flex items-center gap-3 p-3 bg-white border border-slate-100 rounded-2xl mb-3 cursor-grab shadow-[0_2px_10px_rgba(0,0,0,0.02)] hover:shadow-[0_5px_15px_rgba(79,70,229,0.08)] hover:border-indigo-200 transition-all group" draggable="true" ondragstart="onDragStartStudent(event, ${s.id})" ondragend="onDragEndStudent(event)">
                        <div class="w-5 h-8 flex items-center justify-center opacity-30 group-hover:opacity-100 group-hover:text-indigo-500 transition-colors"><i class="ph-bold ph-dots-six-vertical text-lg"></i></div>
                        ${getAvatarImg(s.avatarUrl, s.name, "w-10 h-10 pointer-events-none ring-2 ring-slate-50 shadow-sm")}
                        <div class="flex-1 min-w-0 pointer-events-none">

                        </div>
                    </div>
                `).join('')
                : `<div class="text-center py-12 flex flex-col items-center border-2 border-dashed border-emerald-200 rounded-2xl bg-emerald-50 text-emerald-600 shadow-sm"><i class="ph-fill ph-check-circle text-4xl mb-3"></i><span class="text-sm font-bold">Lớp đã xếp chỗ xong!</span></div>`;
            
            return `
                <div class="max-w-7xl mx-auto animate-fade-in pb-12 pt-2 flex flex-col h-full">
                    
                    <!-- Header -->
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center py-4 border-b border-slate-200 pb-6 mb-6 flex-shrink-0 gap-4">
                        <div>
                            <h2 class="text-2xl md:text-3xl font-black text-[#1e1b4b] tracking-tight flex items-center gap-3">
                                <div class="p-2.5 bg-indigo-50 text-indigo-600 rounded-xl border border-indigo-100 shadow-sm"><i class="ph-fill ph-grid-four text-2xl"></i></div> 
                                Sơ Đồ Lớp Học
                            </h2>
                            <p class="text-slate-500 text-sm font-medium mt-2">Dùng nút + Dãy Trái / Phải để mở rộng. Vuốt/Cuộn ngang nếu sơ đồ quá rộng.</p>
                        </div>
                       <div class="flex gap-2 flex-wrap justify-end sm:justify-start">
                            <button onclick="addColumnLeft()" class="px-3 py-2 bg-emerald-50 text-emerald-600 font-bold text-xs rounded-xl hover:bg-emerald-100 border border-emerald-100 shadow-sm flex items-center" title="Thêm dãy bên trái"><i class="ph-bold ph-align-left mr-1 text-sm"></i> + Dãy Trái</button>
                            <button onclick="addColumnRight()" class="px-3 py-2 bg-emerald-50 text-emerald-600 font-bold text-xs rounded-xl hover:bg-emerald-100 border border-emerald-100 shadow-sm flex items-center" title="Thêm dãy bên phải"><i class="ph-bold ph-align-right mr-1 text-sm"></i> + Dãy Phải</button>
                            <button onclick="addNewSeat()" class="px-3 py-2 bg-slate-100 text-slate-600 font-bold text-xs rounded-xl hover:bg-slate-200 border border-slate-200 shadow-sm flex items-center" title="Thêm 1 ghế ở cuối"><i class="ph-bold ph-plus mr-1 text-sm"></i> Thêm ghế</button>
                            <button onclick="clearAllSeats()" class="px-3 py-2 bg-rose-50 text-rose-600 font-bold text-xs rounded-xl hover:bg-rose-100 border border-rose-100 shadow-sm flex items-center"><i class="ph-bold ph-arrow-counter-clockwise mr-1 text-sm"></i> Thu hồi</button>
                            <button onclick="autoArrangeSeats()" class="px-4 py-2 bg-gradient-to-r from-indigo-600 to-blue-600 text-white font-black text-xs rounded-xl hover:shadow-lg transition-all flex items-center"><i class="ph-bold ph-magic-wand mr-1 text-sm text-yellow-300"></i> Xếp tự động</button>
                        </div>
                    </div>
                    
                    <div class="flex flex-col lg:flex-row gap-8 flex-1 min-h-[600px]">
                        
                        <!-- CỘT TRÁI: Bản Đồ Lớp -->
                        <div class="seat-map-panel flex-1 bg-slate-50/50 bg-[radial-gradient(#cbd5e1_1px,transparent_1px)] [background-size:20px_20px] rounded-[2.5rem] p-6 md:p-8 shadow-inner border border-slate-200 flex flex-col overflow-hidden h-[700px] lg:h-auto relative">
                            <div class="absolute inset-0 bg-gradient-to-b from-white/60 to-transparent pointer-events-none z-0"></div>
                            
                            <!-- Bục giảng siêu thực -->
                            <div class="relative w-full h-36 mb-10 bg-white border border-slate-200 rounded-[2rem] overflow-hidden shadow-[0_8px_30px_rgba(0,0,0,0.04)] flex-shrink-0 z-10">
                                <!-- Cửa ra vào -->
                                <div class="absolute top-0 right-0 w-16 h-full border-l border-slate-100 flex items-center justify-center bg-gradient-to-b from-slate-50 to-slate-100 rounded-r-[2rem] text-slate-400 font-black text-[10px] tracking-widest shadow-inner" style="writing-mode: vertical-rl; transform: rotate(180deg);">CỬA RA VÀO</div>
                                
                                <!-- Bảng xanh từ -->
                                <div class="absolute top-4 left-1/2 -translate-x-1/2 w-[65%] h-8 bg-gradient-to-r from-teal-900 via-emerald-900 to-teal-900 rounded shadow-inner flex items-center justify-center text-teal-50 text-[10px] font-bold tracking-[0.2em] border-4 border-amber-900/80">BẢNG TỪ XANH</div>
                                
                                <!-- Bàn Giáo Viên -->
                                <div class="absolute bottom-4 left-0 w-[calc(33.33%-12px)] h-16 bg-gradient-to-b from-amber-700 to-amber-800 rounded-r-2xl shadow-lg border-b-4 border-amber-950 flex flex-col items-center justify-center text-white border-t border-r border-amber-600">
                                    <i class="ph-fill ph-chalkboard-teacher text-2xl mb-0.5 text-amber-200 opacity-90"></i>
                                    <span class="text-[9px] font-black uppercase tracking-widest text-amber-100 opacity-90">Bàn Giáo Viên</span>
                                </div>
                            </div>
                            
                            <!-- Bọc lưới chỗ ngồi (CÓ CHỨC NĂNG CO GIÃN CHỐNG TRÀN VIỀN) -->
                            <div class="seat-map-scroll flex-1 overflow-auto custom-scrollbar pr-3 pb-6 z-10 w-full relative">
                                <div class="grid gap-3 md:gap-4 w-full transition-all duration-300 mx-auto" style="grid-template-columns: repeat(${state.gridCols}, minmax(110px, 1fr)); min-width: ${state.gridCols * 120}px;">
                                    ${seatsHtml}
                                </div>
                                <div class="text-center mt-10 text-[11px] font-black text-slate-300 uppercase tracking-widest flex items-center justify-center gap-4" style="min-width: ${state.gridCols * 120}px;">
                                    <div class="h-px bg-slate-300 flex-1 max-w-[100px]"></div>
                                    VỊ TRÍ CUỐI LỚP
                                    <div class="h-px bg-slate-300 flex-1 max-w-[100px]"></div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- CỘT PHẢI: Danh sách chờ -->
                        <div class="seat-wait-panel w-full lg:w-[320px] flex-shrink-0 bg-white rounded-[2.5rem] p-7 shadow-[0_8px_30px_rgba(0,0,0,0.04)] border border-slate-100 flex flex-col h-[600px] lg:h-auto z-10" ondragover="onDragOverList(event)" ondrop="onDropList(event)">
                            <div class="flex justify-between items-center mb-5">
                                <h3 class="font-black text-slate-800 uppercase tracking-wide text-sm flex items-center gap-2"><i class="ph-fill ph-users-three text-indigo-500 text-xl"></i> HỌC SINH CHỜ</h3>
                                <span class="bg-indigo-50 text-indigo-700 text-xs font-black px-3 py-1.5 rounded-xl border border-indigo-100 shadow-sm">${unassignedStudents.length} HS</span>
                            </div>
                            <div class="text-xs text-slate-500 mb-6 font-medium bg-slate-50 p-4 rounded-2xl border border-slate-100 leading-relaxed text-center">
                                Cầm và kéo học sinh từ đây và thả vào <b class="text-slate-700">Ghế trống</b>.

                            <div class="flex-1 overflow-y-auto custom-scrollbar pr-2">
                                ${unassignedHtml}
